<style>
:root{
  /* safe areas: Capacitor 8 on Android sets --safe-area-inset-*, browsers and iOS use env() */
  --sa-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sa-r:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --sa-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)); --sa-l:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  --bg:#ECE8DA; --panel:#FBF9F1; --ink:#14213A; --muted:#4A5870; --line:#D3CDB8;
  --road:#CCC6B0; --house:#66748A; --svc:#1F4E8C; --gold:#8F6F1F; --sign:#14284B;
  --good:#2F6B4F; --note:#B08D3C; --bad:#A8401A; --warn-bg:#F7E9C8; --warn-ink:#5A4300; --soft:#E9E4D3; --focus:#1F4E8C;
  --sky:#DCE4E8; --grass:#C9D3B0; --cab:#1F4E8C; --body:#2F6B4F; --on:#FFFFFF;
  --serif:'Libre Caslon Text','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'Libre Franklin','Franklin Gothic Medium','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424; --panel:#131C30; --ink:#ECE8DA; --muted:#9FAEC6; --line:#26324D;
    --road:#2A3856; --house:#8494AE; --svc:#7FA3DA; --gold:#D9B35A; --sign:#22406F;
    --good:#5FB88C; --note:#E8B93B; --bad:#FF8A5C; --warn-bg:#3A2F12; --warn-ink:#F2DDA0; --soft:#1A2540; --focus:#8FB0E6;
    --sky:#14203A; --grass:#1B2B26; --cab:#5B7FBF; --body:#3F8F6A; --on:#0C1424; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424; --panel:#131C30; --ink:#ECE8DA; --muted:#9FAEC6; --line:#26324D;
  --road:#2A3856; --house:#8494AE; --svc:#7FA3DA; --gold:#D9B35A; --sign:#22406F;
  --good:#5FB88C; --note:#E8B93B; --bad:#FF8A5C; --warn-bg:#3A2F12; --warn-ink:#F2DDA0; --soft:#1A2540; --focus:#8FB0E6;
  --sky:#14203A; --grass:#1B2B26; --cab:#5B7FBF; --body:#3F8F6A; --on:#0C1424; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.cash,.v{font-variant-numeric:tabular-nums lining-nums}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--sign);color:#F5F1E3;padding-block:calc(var(--sa-t) + 10px) 10px;padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r))}
.top .row{display:flex;align-items:baseline;gap:10px}
.top .co{font:700 17px/1.1 var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .day{font-size:13px;opacity:.8}
.top .cash{font:700 30px/1.1 var(--sans);letter-spacing:-.5px;margin-top:4px}
.top .sub{display:flex;gap:14px;font-size:13px;opacity:.9;margin-top:2px;flex-wrap:wrap}
.top .sub b{font-weight:600}
.top .neg{color:#FFB79A}

main{flex:1;padding-block:12px calc(84px + var(--sa-b));padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sa-b)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative;min-height:56px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--svc)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.tabs .dot.on{display:block}

h2{font:700 19px/1.2 var(--serif);margin:18px 0 8px}
h2:first-child{margin-top:4px}
h3{font:600 15px/1.25 var(--sans);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.card.offer{border:2px solid var(--note)}
.item{display:flex;gap:12px;align-items:center}
.item .grow{flex:1;min-width:0}
.item .about{color:var(--muted);font-size:13px;margin-top:2px}
.item .meta{font-size:13px;margin-top:3px}
.ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--svc)}
.ic svg{width:22px;height:22px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 12px;min-height:44px;min-width:88px;font-weight:600;font-size:14px;line-height:1.15;text-align:center}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{background:var(--soft);color:var(--muted);border-color:var(--line);cursor:default}
.btn.done{background:transparent;color:var(--good);border-color:transparent}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--svc);border-radius:5px;transition:width .3s}
.bar.bad i{background:var(--bad)}
.bar.good i{background:var(--good)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600}
.pill.bad{background:var(--bad);color:#fff}
.pill.good{background:var(--good);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font:700 20px/1.1 var(--sans)}
.stat .l{font-size:12.5px;color:var(--muted)}
.split{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
.split+.split{border-top:1px dashed var(--line)}

/* the street */
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sky);height:132px;margin-bottom:10px}
.scene svg{display:block;width:100%;height:100%}
.scene .truck{animation:drive var(--dur,14s) linear infinite}
.scene .truck.hop{animation-play-state:running}
@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(460px)}}
@media (prefers-reduced-motion:reduce){.scene .truck{animation:none;transform:translateX(150px)}}
/* region looks: light values, then dark */
.scene.t-lakes{--sky:#D6E6EE;--grass:#BCD3A8;--house:#7A6A58}
.scene.t-plains{--sky:#E4EBF0;--grass:#D9C88E;--house:#8A7A62}
.scene.t-coast{--sky:#CFE8F2;--grass:#EADBB0;--house:#9A8C7A}
.scene.t-desert{--sky:#F2E0C4;--grass:#E2C08E;--house:#B07A50;--road:#CDB79A}
.scene.t-metro{--sky:#D5DAE3;--grass:#AEB6A4;--house:#5D6780}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene.t-lakes{--sky:#152338;--grass:#1C2E26;--house:#6E6252}
  :root:not([data-theme="light"]) .scene.t-plains{--sky:#1A2236;--grass:#3A3420;--house:#77684F}
  :root:not([data-theme="light"]) .scene.t-coast{--sky:#122436;--grass:#3E3826;--house:#7F7464}
  :root:not([data-theme="light"]) .scene.t-desert{--sky:#2A2030;--grass:#4A3626;--house:#8C5E3C;--road:#3A3028}
  :root:not([data-theme="light"]) .scene.t-metro{--sky:#121A2C;--grass:#26302A;--house:#3E4862}}
:root[data-theme="dark"] .scene.t-lakes{--sky:#152338;--grass:#1C2E26;--house:#6E6252}
:root[data-theme="dark"] .scene.t-plains{--sky:#1A2236;--grass:#3A3420;--house:#77684F}
:root[data-theme="dark"] .scene.t-coast{--sky:#122436;--grass:#3E3826;--house:#7F7464}
:root[data-theme="dark"] .scene.t-desert{--sky:#2A2030;--grass:#4A3626;--house:#8C5E3C;--road:#3A3028}
:root[data-theme="dark"] .scene.t-metro{--sky:#121A2C;--grass:#26302A;--house:#3E4862}
.scene .sail{animation:sail 40s linear infinite}
@keyframes sail{from{transform:translateX(-20px)}to{transform:translateX(380px)}}
.scene .blades{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scene .waves{animation:waves 3s linear infinite}
@keyframes waves{to{transform:translateX(40px)}}
.scene .blink{animation:blink 6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
/* the sun goes down and comes up again every few minutes */
.scene .tint{position:absolute;inset:0;pointer-events:none;animation:daylight 240s linear infinite}
@keyframes daylight{0%,40%{background:transparent}50%{background:rgba(232,120,40,.16)}60%,80%{background:rgba(10,18,50,.32)}90%{background:rgba(240,170,90,.12)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.scene .sail,.scene .blades,.scene .waves,.scene .blink,.scene .tint{animation:none}}
.scene .lbl{position:absolute;left:10px;top:8px;font-size:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 8px;border-radius:12px}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:10px}
.tap{position:relative;border:0;border-radius:14px;background:var(--good);color:var(--on);padding:14px 10px;min-height:76px;font-weight:700;font-size:17px;box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000);user-select:none;-webkit-user-select:none}
.tap:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--good) 60%,#000)}
.tap small{display:block;font-weight:500;font-size:13px;opacity:.9}
.tap.alt{background:var(--svc);box-shadow:0 3px 0 color-mix(in srgb,var(--svc) 60%,#000)}
.float{position:fixed;pointer-events:none;font-weight:700;color:var(--good);animation:up .9s ease-out forwards;z-index:20;text-shadow:0 1px 0 var(--panel)}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

.log{font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.log li:first-child{border-top:0}
.log .d{color:var(--muted);min-width:58px;white-space:nowrap}
.log .bad{color:var(--bad)}
.log .good{color:var(--good)}

.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.trophy{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start}
.trophy .ic{width:32px;height:32px;border-radius:8px}
.trophy .ic svg{width:18px;height:18px}
.trophy h3{font-size:13.5px}
.trophy p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.trophy.got .ic{background:var(--note);color:#fff}
.trophy:not(.got){opacity:.6}
.trophy:not(.got) .ic{color:var(--muted)}

.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--sa-b) + 66px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--panel);color:var(--ink);border:2px solid var(--note);border-radius:12px;padding:6px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;max-width:420px;width:100%;animation:drop .3s ease-out}
.toast .ic{background:var(--note);color:#fff;width:30px;height:30px}
.toast .ic svg{width:18px;height:18px}
.toast .small{display:none}
.toast b{display:block;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
@keyframes drop{from{transform:translateY(20px);opacity:0}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,15,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.switch{border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:4px 10px;font-size:12.5px;min-height:32px}
.switch[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--note)}
</style>

<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script>
/* Idle Roundsman engine: the whole simulation, with no screen code, so it runs the same in the app, in tests and in the pacing bot.
   Time is in seconds. Money is in dollars. Everything that grows uses a price multiplier per item already owned. */
(function (root) {
'use strict';

const SERVICES = {
  res: { name: 'Residential', unit: 'homes', each: 'home', rate: 0.25, dump: 0.02, market: 'homes' },
  com: { name: 'Commercial', unit: 'businesses', each: 'business', rate: 3, dump: 0.25, market: 'biz', unlock: 'commercial' },
  ro:  { name: 'Roll-off', unit: 'job sites', each: 'job site', rate: 25, dump: 2.5, market: 'sites', unlock: 'rolloff' }
};

const TRUCKS = {
  pickup: { name: 'Pickup with trailer', svc: 'res', cap: 40, cost: 60, mult: 1.3, fuel: 0.05, about: 'Where everyone starts. Cans in the bed, bags on the trailer.' },
  rear:   { name: 'Rear loader', svc: 'res', cap: 400, cost: 900, mult: 1.13, fuel: 0.4, about: 'Two on the back, one driving. The workhorse of residential.' },
  side:   { name: 'Automated side loader', svc: 'res', cap: 1100, cost: 60000, mult: 1.1, fuel: 0.7, unlock: 'arms', about: 'One driver, an arm and a joystick. Carts must be at the curb.' },
  front:  { name: 'Front loader', svc: 'com', cap: 60, cost: 4000, mult: 1.13, fuel: 0.6, unlock: 'commercial', about: 'Forks over the cab for restaurant and store dumpsters.' },
  roll:   { name: 'Roll-off truck', svc: 'ro', cap: 8, cost: 15000, mult: 1.13, fuel: 0.7, unlock: 'rolloff', about: 'Drops and pulls 30-yard boxes at construction sites.' }
};
const TRUCK_ORDER = ['pickup', 'rear', 'side', 'front', 'roll'];

const TOWNS = [
  { id: 'maple', name: 'Maple Hollow', homes: 400, biz: 20, sites: 2, cost: 0 },
  { id: 'cedar', name: 'Cedar Falls', homes: 1500, biz: 80, sites: 8, cost: 5000 },
  { id: 'river', name: 'Riverton', homes: 5000, biz: 300, sites: 30, cost: 150000 },
  { id: 'granite', name: 'Granite City', homes: 18000, biz: 1100, sites: 110, cost: 2.2e6 },
  { id: 'ashby', name: 'Port Ashby', homes: 60000, biz: 3800, sites: 380, cost: 3.5e7 },
  { id: 'metro', name: 'Metro Bay', homes: 220000, biz: 14000, sites: 1400, cost: 6e8 }
];
const COUNTY_NAMES = ['Three Forks', 'Iron Range', 'Northwoods', 'Twin Rivers', 'Bluegrass', 'Red Rock', 'Pine Barrens', 'Silver Coast', 'Stone Ridge', 'Fox Hollow', 'Elk Run', 'Copper Hills'];

/* Regions (Nov 11): each region is its own branch of the company, with its own cash, trucks, yards, towns and
   customers. Money does not move between them. A region opens once this run has earned its `need`, and starts with
   a set amount (`fund`). After that you can switch back and forth for free; the regions you are not looking at keep
   running at a quarter speed, faster with a regional manager.
   Later regions pay more and have bigger towns, but people trust slowly and turn on you fast. Let your reputation sit
   in the gutter and you get run out: the region is shut for 30 minutes and loses half its customers (trucks and yards
   stay, reputation starts over). Capital Metro is harsher: run out of there and that branch is gone, until you
   rebrand the company (change its name), and it starts over at a lower reputation each time. */
const REGIONS = [
  { id: 'valley', fund: 0, name: 'Maple Valley', about: 'Home. Small towns that give a new hauler a fair shot.', towns: ['Maple Hollow', 'Cedar Falls', 'Riverton', 'Granite City', 'Port Ashby', 'Metro Bay'], scale: 1, rate: 1, up: 1, down: 1, startRep: 60, ban: false, need: 0 },
  { id: 'lakes', fund: 1e5, name: 'Lake Country', about: 'Lake towns and summer cabins. Friendly, but they remember a missed pickup.', towns: ['Loon Lake', 'Birchport', 'Two Harbors', 'Clearwater', 'Pike Bay', 'Lakeview City'], scale: 1.6, rate: 1.5, up: 0.8, down: 1.4, startRep: 50, ban: true, need: 1e7 },
  { id: 'plains', fund: 5e6, name: 'High Plains', about: 'Farm towns far apart. Long routes and proud people who are slow to trust.', towns: ['Dry Creek', 'Wheaton', 'Big Sky', 'Prairie Gate', 'Holt Junction', 'Plainsville'], scale: 2.4, rate: 2.2, up: 0.65, down: 1.8, startRep: 45, ban: true, need: 5e8 },
  { id: 'coast', fund: 1e8, name: 'Gulf Coast', about: 'Beach towns full of tourists. Big money, and a storm of complaints when you slip.', towns: ['Pelican Key', 'Sandy Shores', 'Bayport', 'Palm Point', 'Harbor Isle', 'Coral City'], scale: 3.5, rate: 3.2, up: 0.5, down: 2.3, startRep: 40, ban: true, need: 1e10 },
  { id: 'desert', fund: 3e9, name: 'Red Desert', about: 'Fast-growing desert towns. Heat, dust and city councils with short tempers.', towns: ['Dust Flats', 'Mesa Verde', 'Sun Valley', 'Red Butte', 'Cactus Springs', 'Phoenix Ridge'], scale: 5, rate: 4.5, up: 0.4, down: 2.8, startRep: 35, ban: true, need: 3e11 },
  { id: 'metro', fund: 1e11, name: 'Capital Metro', about: 'The big city. Every council member has your number on speed dial.', towns: ['Old Town', 'Midtown', 'Harbor District', 'Uptown', 'Westside', 'Capital City'], scale: 7, rate: 6.5, up: 0.3, down: 3.4, startRep: 30, ban: true, need: 1e13 }
];
const BAN = { rep: 15, secs: 120, lockSecs: 1800, lose: 0.5, rebrandRep: 10 }; // below 15 reputation for 2 minutes of play gets you run out
/* the regions you are not looking at: 15% speed, +17% per regional manager level (full speed at level 5) */
const MANAGER = { base: 0.15, step: 0.17, max: 5, cost: 50000, share: 0.05, mult: 5 };   // first level: 5% of what the region needs to open (at least $50K), then 5x a level; 15% speed up to 100% at level 5
/* what each region keeps for itself; everything else (name, software, trophies, Legacy, this run's earnings) is shared */
const REGION_KEYS = ['cash', 'towns', 'cust', 'paused', 'trucks', 'drivers', 'pros', 'vets', 'supers', 'mechanics', 'yards', 'yardLvl', 'marketing', 'unlocks', 'down', 'price', 'priceDir', 'offer', 'nextOffer', 'rep', 'banClock', 'manager'];
const lastRegion = () => REGIONS.length - 1;
const region = s => REGIONS[s.region || 0];

/* Towns in a region: its six named towns, then counties that keep getting bigger and dearer. */
function townDef(i, r) {
  const R = REGIONS[r || 0], sc = R.scale;
  if (i < TOWNS.length) { const t = TOWNS[i]; return { id: t.id, name: R.towns[i], homes: Math.round(t.homes * sc), biz: Math.round(t.biz * sc), sites: Math.round(t.sites * sc), cost: t.cost * sc }; }
  const k = i - TOWNS.length + 1, base = TOWNS[TOWNS.length - 1];
  const nm = COUNTY_NAMES[(k - 1) % COUNTY_NAMES.length] + (k > COUNTY_NAMES.length ? ' ' + (Math.floor((k - 1) / COUNTY_NAMES.length) + 1) : '');
  return { id: 'r' + k, name: nm + ' County', homes: Math.round(base.homes * sc * Math.pow(3, k)), biz: Math.round(base.biz * sc * Math.pow(3, k)), sites: Math.round(base.sites * sc * Math.pow(3, k)), cost: base.cost * sc * Math.pow(14, k) };
}
const town = (s, i) => townDef(i, s.region || 0);

/* Software modules: the Roundsman suite, bought level by level. */
/* Every module tops out at a similar late-game price, so none is finished in minutes while another takes all day. */
const SOFTWARE = {
  planner:  { name: 'Route planner', about: 'Tighter routes. +12% stops per truck.', cost: 600, mult: 2.6, max: 15 },
  pricing:  { name: 'Price alignment', about: 'Move old accounts to standard prices. +13% revenue.', cost: 1500, mult: 2.5, max: 15 },
  portal:   { name: 'Customer portal', about: 'Sign-ups online. +25% customer growth.', cost: 900, mult: 3, max: 12 },
  reports:  { name: 'Truck reports', about: 'Pre-trip inspections. -10% breakdowns.', cost: 3000, mult: 2.8, max: 12 },
  dispatch: { name: 'Roadcall dispatch', about: 'Mechanics find the truck faster. -10% repair time.', cost: 4000, mult: 2.8, max: 12 },
  payroll:  { name: 'Hours and payroll', about: 'Clean timesheets and fair schedules. -6% wages and -6% hiring costs.', cost: 5000, mult: 2.8, max: 12 },
  offline:  { name: 'Offline route book', about: 'Routes keep running when you are away. +1 hour away time.', cost: 8000, mult: 3.6, max: 8 }
};

/* One-time unlocks that open new ways to grow. */
const UNLOCKS = {
  commercial: { name: 'Commercial license', about: 'Haul dumpsters for stores and restaurants. Opens front loaders.', cost: 3000 },
  rolloff:    { name: 'Roll-off permit', about: 'Construction boxes pay big per job. Opens roll-off trucks.', cost: 25000, needs: 'commercial' },
  arms:       { name: 'Automated arms', about: 'Side loaders: one driver, triple the stops.', cost: 40000 },
  recycling:  { name: 'Recycling program', about: 'Every home served also sells sorted material. Prices move daily.', cost: 25000 },
  mrf:        { name: 'Sorting plant', about: 'Your own sorting line. Recycling pays 2.5x.', cost: 900000, needs: 'recycling' },
  transfer:   { name: 'Transfer station', about: 'Consolidate loads. Dump fees cut in half.', cost: 120000 },
  landfill:   { name: 'Your own landfill', about: 'No dump fees, and other haulers pay you to tip.', cost: 1.2e7, needs: 'transfer' },
  cng:        { name: 'Natural gas fleet', about: 'CNG fueling at the yard. Fuel costs -45%.', cost: 350000 },
  compost:    { name: 'Yard waste and compost', about: 'Green carts on every route. +15% residential revenue.', cost: 2.5e6, needs: 'recycling' }
};

/* Legacy perks: bought with stars earned by selling the company. They survive every sale. */
const LEGACY = {
  pay:     { name: 'Good name', about: '+25% revenue, every run.', cost: 1, mult: 2, max: 20 },
  grow:    { name: 'Old friends', about: '+30% customer growth.', cost: 1, mult: 2, max: 10 },
  start:   { name: 'Head start', about: 'Start each run with $5,000 per level.', cost: 2, mult: 2, max: 10 },
  away:    { name: 'Long memory', about: '+2 hours of away time.', cost: 2, mult: 2.5, max: 6 },
  tap:     { name: 'Still rides along', about: 'Riding along pays 3x.', cost: 1, mult: 3, max: 6 }
};

const BASE = {
  mechWage: 0.9,            // per mechanic per second
  driverCost: 40, driverMult: 1.05,
  mechCost: 2500, mechMult: 1.35,
  yardCost: 2000, yardMult: 2, yardSlots: 10, drivewaySlots: 4,
  mktCost: 300, mktMult: 1.9,
  growth: 0.006,            // share of the open market signed per second at reputation 50
  breakdown: 1 / 900,       // per working truck per second
  repair: 150,              // seconds a truck is down with no mechanic
  awayHours: 4,
  boostSecs: 1800, boostMax: 7200  // optional 2x income: 30 minutes a reward, at most 2 hours banked
};

/* Driver grades. Everyone starts as a rookie; training moves one driver up a grade.
   Better drivers take the biggest trucks first and get more stops out of them. */
const GRADES = {
  rookie: { name: 'Rookie', boost: 0, wage: 0.5 },
  pro:    { name: 'Pro', boost: 0.3, wage: 2, cost: 15000, mult: 1.06, from: 'rookie', needs: 10, about: '+30% stops on the truck they drive.' },
  vet:    { name: 'Veteran', boost: 0.7, wage: 6, cost: 1.5e6, mult: 1.06, from: 'pro', needs: 50, about: '+70% stops on the truck they drive, and half as many breakdowns.' }
};
/* Route supervisors (Nov 11): open at 15 drivers. Each one looks after 15 drivers; the drivers they cover get 10% more
   stops out of their trucks and break down a quarter less. */
const SUPER = { needs: 15, covers: 15, boost: 0.1, brk: 0.25, wage: 4, cost: 20000, mult: 1.45 };
/* Yard levels (Nov 11): every yard is upgraded together. Bigger yards park more trucks, and each level adds a perk. */
const YARD_TIERS = [
  { name: 'Gravel lot', slots: 10, about: 'Room for 10 trucks a yard.' },
  { name: 'Shop yard', slots: 15, cost: 2.5e5, repair: 0.85, about: '15 trucks a yard, and a shop: repairs 15% faster.' },
  { name: 'Depot', slots: 25, cost: 6e6, fuel: 0.9, about: '25 trucks a yard, and a fuel island: fuel 10% cheaper.' },
  { name: 'Regional hub', slots: 45, cost: 2e8, dump: 0.85, about: '45 trucks a yard, and a tipping floor: dump fees 15% lower.' }
];
const yardTier = s => YARD_TIERS[Math.min(YARD_TIERS.length - 1, s.yardLvl || 0)];
const yardPerk = (s, k) => YARD_TIERS.slice(1, (s.yardLvl || 0) + 1).reduce((m, t) => m * (t[k] || 1), 1);
const TAU = { day: 30 }; // one in-game day is 30 seconds

function fresh(legacy) {
  legacy = legacy || { stars: 0, earnedStars: 0, perks: {}, sales: 0, best: 0, achievements: {} };
  const s = {
    v: 1, cash: 0, earned: 0, t: 0, day: 1, rep: 60,
    towns: 1, cust: { res: 0, com: 0, ro: 0 }, paused: { res: false, com: false, ro: false },
    trucks: { pickup: 1, rear: 0, side: 0, front: 0, roll: 0 },
    drivers: 0, pros: 0, vets: 0, supers: 0, mechanics: 0, yards: 0, yardLvl: 0, marketing: 0, manager: 0,
    software: {}, unlocks: {},
    down: [],                 // [{ type, left, total, where }]
    price: 1, priceDir: 0,    // recycling price index
    offer: null, nextOffer: 120,
    log: [],
    stats: { taps: 0, flyers: 0, roadcalls: 0, rushed: 0, contracts: 0, bestNet: 0, perfectDays: 0, missedDays: 0, away: 0, maxPrice: 1 },
    legacy, seed: (Math.random() * 2 ** 31) | 0,
    boost: 0,                 // seconds of 2x income left
    region: 0, banned: {}, banClock: 0, regions: {}, locks: {}, metroRep: 0, // see REGIONS
    lastSeen: Date.now()
  };
  s.cash = 5000 * lvl(legacy.perks, 'start');
  return s;
}

const lvl = (o, k) => (o && o[k]) || 0;
const costAt = (base, mult, n) => Math.ceil(base * Math.pow(mult, n));

function rand(s) { // small seeded generator so the pacing bot and tests repeat
  s.seed = (s.seed * 1103515245 + 12345) & 0x7fffffff; return s.seed / 0x7fffffff;
}

/* ---------- derived numbers ---------- */
function market(s) {
  const m = { res: 0, com: 0, ro: 0 };
  for (let i = 0; i < s.towns; i++) { const t = town(s, i); m.res += t.homes; m.com += t.biz; m.ro += t.sites; }
  return m;
}
function slots(s) { return BASE.drivewaySlots + s.yards * yardTier(s).slots; }
function truckCount(s) { return TRUCK_ORDER.reduce((n, k) => n + s.trucks[k], 0); }
function needDrivers(s) { return Math.max(0, truckCount(s) - 1); } // you drive one truck yourself
function achCount(s) { return Object.keys(s.legacy.achievements).length; }

/* share of the drivers a supervisor looks after (0 to 1) */
function superCover(s) { return s.drivers > 0 ? Math.min(1, (s.supers || 0) * SUPER.covers / s.drivers) : 0; }
function mults(s) {
  const sw = s.software, L = s.legacy.perks;
  return {
    cap: (1 + 0.12 * lvl(sw, 'planner')) * (1 + SUPER.boost * superCover(s)),
    rev: (1 + 0.13 * lvl(sw, 'pricing')) * (1 + 0.02 * achCount(s)) * (1 + 0.25 * lvl(L, 'pay')) * (1 + 0.1 * s.legacy.stars) * (s.boost > 0 ? 2 : 1) * region(s).rate,
    growth: (1 + 0.25 * lvl(sw, 'portal')) * (1 + 0.3 * lvl(L, 'grow')) * (1 + 0.35 * s.marketing),
    brk: Math.pow(0.9, lvl(sw, 'reports')) / (1 + 0.25 * s.mechanics) * (1 - SUPER.brk * superCover(s)),
    repair: Math.pow(0.9, lvl(sw, 'dispatch')) * yardPerk(s, 'repair'),
    wage: Math.pow(0.94, lvl(sw, 'payroll')),
    fuel: (s.unlocks.cng ? 0.55 : 1) * yardPerk(s, 'fuel'),
    dump: (s.unlocks.landfill ? 0 : s.unlocks.transfer ? 0.5 : 1) * yardPerk(s, 'dump'),
    awayH: BASE.awayHours + lvl(sw, 'offline') + 2 * lvl(L, 'away')
  };
}

/* Which trucks are on the road: not broken down, inside a yard slot, and with someone to drive them.
   Bigger trucks get drivers and slots first. */
function working(s) {
  const downBy = {}; s.down.forEach(d => { downBy[d.type] = (downBy[d.type] || 0) + 1; });
  let seats = s.drivers + 1, room = slots(s);
  const out = {}, order = ['side', 'roll', 'front', 'rear', 'pickup'];
  order.forEach(k => {
    const avail = Math.max(0, s.trucks[k] - (downBy[k] || 0));
    const n = Math.min(avail, seats, room); out[k] = n; seats -= n; room -= n;
  });
  return out;
}

/* Who drives what: veterans take the biggest running trucks, then pros, then rookies.
   Returns, for each truck type, how many veterans and pros are on it. */
function crew(s, w) {
  w = w || working(s); let v = s.vets || 0, p = s.pros || 0; const out = {};
  ['side', 'roll', 'front', 'rear', 'pickup'].forEach(k => {
    const nv = Math.min(w[k], v); v -= nv; const np = Math.min(w[k] - nv, p); p -= np; out[k] = { vet: nv, pro: np };
  });
  return out;
}
function capacity(s, w) {
  w = w || working(s); const m = mults(s), c = { res: 0, com: 0, ro: 0 }, cr = crew(s, w);
  TRUCK_ORDER.forEach(k => { c[TRUCKS[k].svc] += (w[k] + cr[k].vet * GRADES.vet.boost + cr[k].pro * GRADES.pro.boost) * TRUCKS[k].cap * m.cap; });
  return c;
}
function wagesPerSec(s) {
  const pros = s.pros || 0, vets = s.vets || 0;
  return ((s.drivers - pros - vets) * GRADES.rookie.wage + pros * GRADES.pro.wage + vets * GRADES.vet.wage + (s.supers || 0) * SUPER.wage + s.mechanics * BASE.mechWage) * mults(s).wage;
}

/* Money per second, split into its parts, for the current state. */
function economy(s) {
  const w = working(s), cap = capacity(s, w), m = mults(s);
  const served = {}, missed = {}; let gross = 0, dump = 0;
  Object.keys(SERVICES).forEach(k => {
    served[k] = Math.min(s.cust[k], cap[k]); missed[k] = Math.max(0, s.cust[k] - cap[k]);
    let r = served[k] * SERVICES[k].rate * m.rev;
    if (k === 'res' && s.unlocks.compost) r *= 1.15;
    gross += r; dump += served[k] * SERVICES[k].dump;
  });
  let recycle = 0;
  if (s.unlocks.recycling) recycle = served.res * 0.035 * s.price * (s.unlocks.mrf ? 2.5 : 1) * m.rev;
  let tipping = 0;
  if (s.unlocks.landfill) tipping = (served.res * SERVICES.res.dump + served.com * SERVICES.com.dump + served.ro * SERVICES.ro.dump) * 1.5 + 40 * s.towns;
  dump *= m.dump;
  const fuel = TRUCK_ORDER.reduce((n, k) => n + w[k] * TRUCKS[k].fuel, 0) * m.fuel;
  const wages = wagesPerSec(s);
  const income = gross + recycle + tipping, costs = dump + fuel + wages;
  const totalCust = s.cust.res + s.cust.com + s.cust.ro, totalMissed = missed.res + missed.com + missed.ro;
  return { w, cap, served, missed, gross, recycle, tipping, dump, fuel, wages, income, costs, net: income - costs, totalCust, totalMissed };
}

function tapValue(s) {
  const e = economy(s);
  return (1 + Math.max(0, e.net) * 0.1) * (1 + 2 * lvl(s.legacy.perks, 'tap'));
}

/* ---------- prices of things ---------- */
const price = {
  truck: (s, k) => costAt(TRUCKS[k].cost, TRUCKS[k].mult, k === 'pickup' ? s.trucks.pickup - 1 : s.trucks[k]),
  driver: s => Math.ceil(costAt(BASE.driverCost, BASE.driverMult, s.drivers) * mults(s).wage),
  train: (s, g) => Math.ceil(costAt(GRADES[g].cost, GRADES[g].mult, g === 'pro' ? (s.pros || 0) + (s.vets || 0) : (s.vets || 0)) * mults(s).wage),
  mechanic: s => costAt(BASE.mechCost, BASE.mechMult, s.mechanics),
  supervisor: s => Math.ceil(costAt(SUPER.cost, SUPER.mult, s.supers || 0) * mults(s).wage),
  yardTier: s => { const t = YARD_TIERS[(s.yardLvl || 0) + 1]; return t ? Math.ceil(t.cost * Math.max(1, s.yards) * region(s).scale) : Infinity; },
  manager: s => Math.ceil(costAt(Math.max(MANAGER.cost, region(s).need * MANAGER.share), MANAGER.mult, s.manager || 0)),
  rename: s => isDefaultName(s.name) ? 0 : Math.max(25000, Math.ceil(s.earned * 0.02)),
  yard: s => costAt(BASE.yardCost, BASE.yardMult, s.yards),
  marketing: s => costAt(BASE.mktCost, BASE.mktMult, s.marketing),
  software: (s, k) => costAt(SOFTWARE[k].cost, SOFTWARE[k].mult, lvl(s.software, k)),
  unlock: (s, k) => UNLOCKS[k].cost,
  town: s => town(s, s.towns).cost,
  legacy: (s, k) => costAt(LEGACY[k].cost, LEGACY[k].mult, lvl(s.legacy.perks, k)),
  rush: (s, d) => Math.ceil(50 + d.left * (TRUCKS[d.type].cost / 400))
};

/* ---------- actions (each returns '' on success or the reason it can't) ---------- */
function spend(s, n) { if (s.cash < n) return 'Not enough cash yet.'; s.cash -= n; return ''; }
function note(s, txt, kind) { s.log.unshift({ t: s.t, day: Math.floor(s.day), txt, kind: kind || '' }); if (s.log.length > 40) s.log.length = 40; }

const act = {
  tap(s) { const v = tapValue(s); s.cash += v; s.earned += v; s.stats.taps++; return v; },
  flyer(s) {
    const mk = market(s); s.stats.flyers++;
    if (s.cust.res < mk.res && rand(s) < 0.35) { s.cust.res++; return 1; } return 0;
  },
  buyTruck(s, k) {
    const T = TRUCKS[k]; if (!T) return 'No such truck.';
    if (T.unlock && !s.unlocks[T.unlock]) return 'Needs ' + UNLOCKS[T.unlock].name + '.';
    if (truckCount(s) >= slots(s)) return 'No room in the yard. Buy a yard first.';
    const e = spend(s, price.truck(s, k)); if (e) return e;
    s.trucks[k]++; note(s, 'Bought a ' + T.name.toLowerCase() + '.'); return '';
  },
  hireDriver(s) { const e = spend(s, price.driver(s)); if (e) return e; s.drivers++; return ''; },
  train(s, g) {
    const G = GRADES[g]; if (!G || !G.from) return 'No such grade.';
    if (s.drivers < G.needs) return 'Needs ' + G.needs + ' drivers on the payroll first.';
    if (gradeCount(s, G.from) < 1) return 'Nobody to train: hire or train a ' + GRADES[G.from].name.toLowerCase() + ' first.';
    const e = spend(s, price.train(s, g)); if (e) return e;
    if (g === 'pro') s.pros = (s.pros || 0) + 1; else { s.pros--; s.vets = (s.vets || 0) + 1; }
    return '';
  },
  hireMechanic(s) { const e = spend(s, price.mechanic(s)); if (e) return e; s.mechanics++; note(s, 'Hired mechanic number ' + s.mechanics + '.'); return ''; },
  buyYard(s) { const e = spend(s, price.yard(s)); if (e) return e; s.yards++; note(s, 'Opened yard ' + s.yards + '. Room for ' + slots(s) + ' trucks.', 'good'); return ''; },
  marketing(s) { const e = spend(s, price.marketing(s)); if (e) return e; s.marketing++; return ''; },
  software(s, k) {
    const S = SOFTWARE[k]; if (!S) return 'No such module.'; if (lvl(s.software, k) >= S.max) return 'Fully upgraded.';
    const e = spend(s, price.software(s, k)); if (e) return e; s.software[k] = lvl(s.software, k) + 1; return '';
  },
  unlock(s, k) {
    const U = UNLOCKS[k]; if (!U) return 'No such thing.'; if (s.unlocks[k]) return 'Already done.';
    if (U.needs && !s.unlocks[U.needs]) return 'Needs ' + UNLOCKS[U.needs].name + ' first.';
    const e = spend(s, U.cost); if (e) return e; s.unlocks[k] = true; note(s, U.name + ': done.', 'good'); return '';
  },
  expand(s) {
    const e = spend(s, price.town(s)); if (e) return e; s.towns++; note(s, 'Now serving ' + town(s, s.towns - 1).name + '.', 'good'); return '';
  },
  rush(s, i) {
    const d = s.down[i]; if (!d) return 'Already fixed.'; const e = spend(s, price.rush(s, d)); if (e) return e;
    s.down.splice(i, 1); s.stats.rushed++; s.stats.roadcalls++; note(s, 'Rushed the fix on a ' + TRUCKS[d.type].name.toLowerCase() + '.'); return '';
  },
  acceptOffer(s) {
    const o = s.offer; if (!o) return 'That offer is gone.';
    const e = economy(s), spare = e.cap[o.svc] - s.cust[o.svc];
    if (spare < o.qty) return 'You need room for ' + fmt(o.qty) + ' more ' + SERVICES[o.svc].unit + ' on your trucks.';
    const mk = market(s), add = Math.min(o.qty, mk[o.svc] - s.cust[o.svc]);
    s.cust[o.svc] += Math.max(0, add); s.cash += o.bonus; s.earned += o.bonus; s.rep = Math.min(100, s.rep + 2);
    s.stats.contracts++; note(s, 'Signed: ' + o.title + '. +' + fmtMoney(o.bonus) + '.', 'good'); s.offer = null; return '';
  },
  declineOffer(s) { s.offer = null; return ''; },
  /* Rewards the player chose to earn (an ad they asked to watch, or the Supporter Pack). */
  boost(s) {
    if (s.boost > BASE.boostMax - BASE.boostSecs) return 'You already have ' + Math.round(s.boost / 60) + ' minutes of double income banked.';
    s.boost = (s.boost || 0) + BASE.boostSecs; s.stats.boosts = (s.stats.boosts || 0) + 1; return '';
  },
  doubleAway(s, r) {
    if (!r || r.doubled || !(r.cash > 0)) return 'Nothing to double.';
    r.doubled = true; s.cash += r.cash; s.earned += r.cash; return '';
  },
  pause(s, k) { s.paused[k] = !s.paused[k]; return ''; },
  /* Switch to another region (Nov 11). A region you have not run yet starts with its set amount; one you have run
     is just as you left it (it kept running at its manager's speed). Money does not move. */
  move(s, r) {
    r = +r; const R = REGIONS[r]; if (!R) return 'No such region.';
    if (r === (s.region || 0)) return 'You are already here.';
    if (s.banned[R.id]) return R.name + ' ran you out. Rebrand the company (change its name) to try again.';
    const left = lockLeft(s, R.id); if (left > 0) return R.name + ' is shut to you for ' + Math.ceil(left / 60) + ' more minutes.';
    const known = !!(s.regions && s.regions[r]);
    if (!known && s.earned < R.need) return 'Earn ' + fmtMoney(R.need) + ' this run first.';
    switchTo(s, r, true);
    note(s, known ? 'Back in ' + R.name + '.' : 'Opened a branch in ' + R.name + ' with ' + fmtMoney(s.cash) + '. One pickup in ' + R.towns[0] + '.', 'good'); return '';
  },
  /* Rename the company. Free while it still has the starting name; after that it costs. Rebranding is also the only
     way back into Capital Metro after being run out (starting lower each time). */
  rename(s, name) {
    name = String(name || '').trim().slice(0, 32); if (!name) return 'Pick a name.';
    if (name === s.name) return '';
    const fee = price.rename(s); if (fee && s.cash < fee) return 'Rebranding costs ' + fmtMoney(fee) + ' (paid from ' + region(s).name + ').';
    s.cash -= fee; s.name = name; s.stats.renames = (s.stats.renames || 0) + 1;
    const M = REGIONS[lastRegion()];
    if (s.banned[M.id]) { delete s.banned[M.id]; s.metroRep = Math.max(5, (s.metroRep || M.startRep) - BAN.rebrandRep); note(s, 'Rebranded as ' + name + '. ' + M.name + ' will give you another try, starting at reputation ' + s.metroRep + '.', 'good'); }
    return '';
  },
  hireSupervisor(s) {
    if (s.drivers < SUPER.needs) return 'Supervisors start at ' + SUPER.needs + ' drivers.';
    const e = spend(s, price.supervisor(s)); if (e) return e; s.supers = (s.supers || 0) + 1; note(s, 'Hired route supervisor number ' + s.supers + '.'); return '';
  },
  upgradeYards(s) {
    const t = YARD_TIERS[(s.yardLvl || 0) + 1]; if (!t) return 'Your yards are as big as they get.'; if (s.yards < 1) return 'Open a yard first.';
    const e = spend(s, price.yardTier(s)); if (e) return e; s.yardLvl = (s.yardLvl || 0) + 1; note(s, 'Every yard is now a ' + t.name.toLowerCase() + '. Room for ' + slots(s) + ' trucks.', 'good'); return '';
  },
  hireManager(s) {
    if ((s.manager || 0) >= MANAGER.max) return 'This region\'s manager is as good as they get.';
    const e = spend(s, price.manager(s)); if (e) return e; s.manager = (s.manager || 0) + 1; note(s, region(s).name + ' manager: level ' + s.manager + '. It runs at ' + Math.round(100 * awaySpeed(s)) + '% while you are elsewhere.'); return '';
  },
  /* Sell the company: stars from what this run earned, then a fresh start with everything Legacy keeps. */
  sell(s) {
    const st = starsFor(s); if (st < 1) return 'Buyers want a company that has earned at least $1M.';
    const L = s.legacy; L.stars += st; L.earnedStars += st; L.sales++; L.best = Math.max(L.best || 0, s.earned);
    const n = fresh(L); n.stats.away = 0; n.boost = s.boost || 0; note(n, 'Sold the old company for ' + st + ' Legacy star' + (st > 1 ? 's' : '') + '. Back to one pickup.', 'good');
    return n;
  },
  legacy(s, k) {
    const P = LEGACY[k]; if (!P) return 'No such perk.'; if (lvl(s.legacy.perks, k) >= P.max) return 'Maxed.';
    const c = price.legacy(s, k); if (s.legacy.stars < c) return 'Not enough stars.';
    s.legacy.stars -= c; s.legacy.perks[k] = lvl(s.legacy.perks, k) + 1; if (k === 'start') s.cash += 5000; return '';
  }
};

function gradeCount(s, g) { const p = s.pros || 0, v = s.vets || 0; return g === 'vet' ? v : g === 'pro' ? p : s.drivers - p - v; }
function starsFor(s) { return s.earned < 1e6 ? 0 : Math.floor(Math.pow(s.earned / 1e6, 0.4)); }

/* ---------- contract offers ---------- */
const OFFERS = [
  { svc: 'res', title: '{t} HOA wants one hauler', size: 0.08, bonus: 120 },
  { svc: 'res', title: '{t} switches from a hauler that went bust', size: 0.15, bonus: 90 },
  { svc: 'res', title: 'Senior living campus in {t}', size: 0.04, bonus: 200 },
  { svc: 'com', title: '{t} strip mall, all tenants', size: 0.1, bonus: 300 },
  { svc: 'com', title: 'Restaurant row in {t}', size: 0.06, bonus: 400 },
  { svc: 'ro', title: 'New subdivision going up in {t}', size: 0.12, bonus: 900 },
  { svc: 'ro', title: '{t} hospital renovation', size: 0.06, bonus: 1500 }
];
function makeOffer(s) {
  const mk = market(s), opts = OFFERS.filter(o => (!SERVICES[o.svc].unlock || s.unlocks[SERVICES[o.svc].unlock]) && mk[o.svc] - s.cust[o.svc] > 5);
  if (!opts.length) return null;
  const o = opts[Math.floor(rand(s) * opts.length)], open = mk[o.svc] - s.cust[o.svc];
  const qty = Math.max(3, Math.min(open, Math.round(mk[o.svc] * o.size * (0.7 + rand(s) * 0.6))));
  const where = town(s, Math.floor(rand(s) * s.towns)).name;
  const bonus = Math.round(qty * SERVICES[o.svc].rate * o.bonus * mults(s).rev);
  return { svc: o.svc, title: o.title.replace('{t}', where), qty, bonus, left: 90 };
}

/* ---------- the clock ---------- */
/* Advance the world by dt seconds. quiet=true is used for time away: no breakdowns or offers, just routes. */
function tick(s, dt, quiet) {
  if (s.regions && Object.keys(s.regions).length) tickAway(s, dt);
  const m = mults(s), mk = market(s);
  if (s.boost > 0) s.boost = Math.max(0, s.boost - dt);
  // breakdowns and repairs
  if (!quiet) {
    const w = working(s), cr = crew(s, w);
    TRUCK_ORDER.forEach(k => {
      for (let i = 0; i < w[k]; i++) if (rand(s) < BASE.breakdown * m.brk * (i < cr[k].vet ? 0.5 : 1) * dt) {
        const total = BASE.repair * m.repair / (1 + 0.5 * s.mechanics);
        s.nid = (s.nid || 0) + 1;
        s.down.push({ id: 'd' + s.nid, type: k, left: total, total, where: STREETS[Math.floor(rand(s) * STREETS.length)] });
        note(s, 'Roadcall: ' + TRUCKS[k].name.toLowerCase() + ' down on ' + s.down[s.down.length - 1].where + '.', 'bad');
      }
    });
  }
  for (let i = s.down.length - 1; i >= 0; i--) { s.down[i].left -= dt; if (s.down[i].left <= 0) { s.down.splice(i, 1); s.stats.roadcalls++; } }

  const e = economy(s);
  // customers: signed from the open market, faster with a good name; lost when service is poor
  const repF = Math.pow(s.rep / 50, 1.5), RG = region(s);
  Object.keys(SERVICES).forEach(k => {
    if (SERVICES[k].unlock && !s.unlocks[SERVICES[k].unlock]) return;
    const open = mk[k] - s.cust[k];
    if (open > 0 && !(s.paused && s.paused[k])) s.cust[k] += Math.min(open, Math.max(open * BASE.growth * m.growth * repF * dt, (k === 'res' ? 0.6 : 0.05) * m.growth * repF * dt));
    if (s.rep < 35) s.cust[k] *= Math.pow(1 - 0.002 * RG.down * (35 - s.rep) / 35, dt);
    s.cust[k] = Math.max(0, Math.min(mk[k], s.cust[k]));
  });
  // reputation drifts toward how well you serve
  const ratio = e.totalCust > 0 ? e.totalMissed / e.totalCust : 0;
  const target = ratio > 0 ? Math.max(5, 75 - 160 * RG.down * ratio) : 75 + Math.min(25, s.mechanics * 2 + lvl(s.software, 'portal') * 2 + s.marketing);
  s.rep += (target - s.rep) * Math.min(1, 0.02 * (target > s.rep ? RG.up : RG.down) * dt);
  // in the tougher regions, a reputation in the gutter for too long gets you run out (only while you are playing)
  if (RG.ban && !quiet) {
    s.banClock = s.rep < BAN.rep ? (s.banClock || 0) + dt : 0;
    if (s.banClock >= BAN.secs) { runOut(s); return; }
  }
  // money
  const got = e.net * dt;
  s.cash += got; if (e.income > 0) s.earned += e.income * dt;
  if (s.cash < 0) s.cash = 0;
  s.stats.bestNet = Math.max(s.stats.bestNet, e.net);
  // recycling prices wander
  if (s.unlocks.recycling) {
    s.priceDir += (rand(s) - 0.5) * 0.02 * dt - (s.price - 1) * 0.004 * dt; s.priceDir = Math.max(-0.02, Math.min(0.02, s.priceDir));
    s.price = Math.max(0.35, Math.min(1.9, s.price + s.priceDir * dt)); s.stats.maxPrice = Math.max(s.stats.maxPrice, s.price);
  }
  // days
  const before = Math.floor(s.day); s.day += dt / TAU.day; s.t += dt;
  if (Math.floor(s.day) > before && e.totalCust >= 100) { if (e.totalMissed < 0.5) s.stats.perfectDays++; else s.stats.missedDays++; }
  // offers
  if (!quiet) {
    if (s.offer) { s.offer.left -= dt; if (s.offer.left <= 0) s.offer = null; }
    else if ((s.nextOffer -= dt) <= 0) { s.offer = makeOffer(s); s.nextOffer = 150 + rand(s) * 150; }
  }
}

/* Regions (Nov 11) */
const isDefaultName = n => !n || n === 'Curbside Hauling';
const awaySpeed = snap => Math.min(1, MANAGER.base + MANAGER.step * (snap.manager || 0));
const lockLeft = (s, id) => s.locks && s.locks[id] ? Math.max(0, s.locks[id] - s.t) : 0;
const copy = o => JSON.parse(JSON.stringify(o));
function snapshot(s) { const o = {}; REGION_KEYS.forEach(k => { o[k] = copy(s[k] === undefined ? null : s[k]); }); return o; }
function startRegion(s, r) {
  const L = s.legacy, R = REGIONS[r], n = fresh(L), o = {};
  REGION_KEYS.forEach(k => { o[k] = copy(n[k]); });
  o.cash = R.fund + 5000 * lvl(L.perks, 'start');
  o.rep = r === lastRegion() && s.metroRep ? s.metroRep : R.startRep;
  return o;
}
/* make region r the one on screen; keep=false drops the region being left (it was lost) */
function switchTo(s, r, keep) {
  s.regions = s.regions || {};
  if (keep) s.regions[s.region || 0] = snapshot(s);
  const o = s.regions[r] || startRegion(s, r); delete s.regions[r];
  REGION_KEYS.forEach(k => { s[k] = o[k]; }); s.region = r; s.banClock = 0;
  s.stats.moves = (s.stats.moves || 0) + 1;
  s.legacy.regions = s.legacy.regions || {}; s.legacy.regions[REGIONS[r].id] = 1;
}
function runOut(s) {
  const fromI = s.region, from = REGIONS[fromI], lost = fromI === lastRegion(); s.legacy.bans = (s.legacy.bans || 0) + 1;
  // go to the best branch you already have; a new one only when none is open
  const ok = i => i !== fromI && !s.banned[REGIONS[i].id] && lockLeft(s, REGIONS[i].id) <= 0;
  let to = -1; for (let i = REGIONS.length - 1; i >= 0; i--) if (s.regions && s.regions[i] && ok(i)) { to = i; break; }
  if (to < 0) { to = fromI - 1; while (to > 0 && !ok(to)) to--; if (to < 0) to = 0; }
  if (lost) {
    s.banned[from.id] = 1; switchTo(s, to, false);
    note(s, 'Run out of ' + from.name + '. The council pulled every permit and that branch is gone. Rebrand the company to try again.', 'bad');
  } else {
    Object.keys(s.cust).forEach(c => { s.cust[c] = Math.floor(s.cust[c] * (1 - BAN.lose)); });
    s.rep = from.startRep; s.offer = null; s.locks = s.locks || {}; s.locks[from.id] = s.t + BAN.lockSecs;
    switchTo(s, to, true);
    note(s, 'Run out of ' + from.name + ' for 30 minutes. Half its customers left; the trucks and yards are waiting. Now in ' + REGIONS[to].name + '.', 'bad');
  }
}
/* the regions not on screen: run them at their manager's speed (quiet, like time away) */
function tickAway(s, dt) {
  Object.keys(s.locks || {}).forEach(id => { if (s.locks[id] <= s.t) delete s.locks[id]; });
  Object.keys(s.regions || {}).forEach(i => {
    const o = s.regions[i], R = REGIONS[+i]; if (!R || lockLeft(s, R.id) > 0) return;
    const tmp = Object.assign({}, s, o, { region: +i, regions: {}, stats: Object.assign({}, s.stats), log: [] }), e0 = s.earned;
    tick(tmp, dt * awaySpeed(o), true);
    REGION_KEYS.forEach(k => { o[k] = tmp[k]; });
    s.earned += tmp.earned - e0;
  });
}

/* Time away: run the routes in one-minute steps, capped by the away-time limit. Returns what happened. */
function catchUp(s, now) {
  now = now || Date.now();
  const gone = Math.max(0, (now - (s.lastSeen || now)) / 1000), cap = mults(s).awayH * 3600, dt = Math.min(gone, cap);
  s.lastSeen = now; if (dt < 30) return null;
  const c0 = s.cash, cust0 = s.cust.res + s.cust.com + s.cust.ro; let left = dt;
  while (left > 0) { const step = Math.min(60, left); tick(s, step, true); left -= step; }
  s.stats.away += dt;

<script>
/* Optional rewards and the Supporter Pack, for the Android app only. The web version has neither.
   No ad ever plays unless the player taps a reward button. The Supporter Pack gives every reward
   without an ad. It is a one-time Google Play purchase tied to the player's Google account, so it
   comes back after a reinstall or on a new phone. */
(function () {
'use strict';
const CONFIG = {
  // Idle Roundsman's own AdMob rewarded unit. The AdMob app ID is in apps/mobile/android/app/src/main/res/values/strings.xml.
  // For sample ads while developing, use Google's test unit ca-app-pub-3940256099942544/5224354917 and set testing to true.
  rewardedAdId: 'ca-app-pub-5053037162821375/2331589132',
  testing: false,
  product: 'supporter_pack',
  roundsmanUrl: 'https://roundsman.app'
};
const cap = window.Capacitor;
const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform() && cap.registerPlugin);
const AdMob = native ? cap.registerPlugin('AdMob') : null, Shop = native ? cap.registerPlugin('NativePurchases') : null;
const KEY = 'idle-roundsman-supporter';
let supporter = false, adsOn = false, adsStarted = false, ready = false, loading = false, busy = false;
let shopOn = false, price = '', privacyNeeded = false;
try { supporter = localStorage.getItem(KEY) === '1'; } catch (e) { /* storage blocked */ }
const subs = []; const changed = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
function setSupporter(v) {
  if (supporter === v) return; supporter = v;
  try { if (v) localStorage.setItem(KEY, '1'); else localStorage.removeItem(KEY); } catch (e) { /* storage blocked */ }
  changed(); if (!v) startAds();
}
const owned = p => p && p.productIdentifier === CONFIG.product && (p.purchaseState === undefined || String(p.purchaseState) === '1');

/* ---------- ads ---------- */
async function startAds() {
  if (!AdMob || adsStarted || supporter) return; adsStarted = true;
  try {
    let c = await AdMob.requestConsentInfo();
    if (c.isConsentFormAvailable && c.status === 'REQUIRED') c = await AdMob.showConsentForm();
    privacyNeeded = c.privacyOptionsRequirementStatus === 'REQUIRED';
    if (c.canRequestAds) { await AdMob.initialize({ initializeForTesting: CONFIG.testing }); adsOn = true; preload(); }
  } catch (e) { console.warn('Ads are off:', e); }
  changed();
}
function preload() {
  if (!adsOn || ready || loading) return; loading = true;
  AdMob.prepareRewardVideoAd({ adId: CONFIG.rewardedAdId, isTesting: CONFIG.testing })
    .then(() => { ready = true; })
    .catch(() => { setTimeout(preload, 60000); })
    .finally(() => { loading = false; changed(); });
}
/* Resolves true when the player earned the reward. */
async function reward() {
  if (supporter) return true;
  if (!ready || busy) return false;
  busy = true; ready = false; changed();
  let got = false; const hs = [];
  try {
    await new Promise(async done => {
      const finish = () => setTimeout(done, 400); // the reward callback can land just after the close
      hs.push(await AdMob.addListener('onRewardedVideoAdReward', () => { got = true; }));
      hs.push(await AdMob.addListener('onRewardedVideoAdDismissed', finish));
      hs.push(await AdMob.addListener('onRewardedVideoAdFailedToShow', finish));
      AdMob.showRewardVideoAd().then(() => { got = true; }).catch(finish);
    });
  } finally { hs.forEach(h => { try { h.remove(); } catch (e) { /* gone */ } }); busy = false; preload(); changed(); }
  return got;
}

/* ---------- Supporter Pack ---------- */
async function startShop() {
  if (!Shop) return;
  try {
    const b = await Shop.isBillingSupported(); if (!b || !b.isBillingSupported) return;
    shopOn = true;
    const r = await Shop.getProducts({ productIdentifiers: [CONFIG.product], productType: 'inapp' });
    if (r && r.products && r.products[0]) price = r.products[0].priceString || '';
    await restore();
  } catch (e) { console.warn('Shop is off:', e); }
  changed();
}
/* Asks Google Play what this account owns. With no answer (no signal) the last known state stays. */
async function restore() {
  const r = await Shop.getPurchases({ productType: 'inapp' });
  const mine = (r && r.purchases || []).filter(owned);
  mine.forEach(p => { if (p.isAcknowledged === false && p.purchaseToken) Shop.acknowledgePurchase({ purchaseToken: p.purchaseToken }).catch(() => {}); });
  setSupporter(mine.length > 0); return mine.length > 0;
}
async function buy() {
  const t = await Shop.purchaseProduct({ productIdentifier: CONFIG.product, productType: 'inapp' });
  if (owned(t)) { setSupporter(true); return 'owned'; }
  return 'pending'; // e.g. paying cash at a store: Google finishes it later and restore() picks it up
}

function openRoundsman() {
  if (native) window.location.href = CONFIG.roundsmanUrl; // the app hands outside links to the browser
  else window.open(CONFIG.roundsmanUrl, '_blank', 'noopener');
}

window.Money = {
  native,
  get supporter() { return supporter; },
  get shopOn() { return shopOn; },
  get price() { return price; },
  get privacyNeeded() { return privacyNeeded; },
  /* Reward buttons show only in the app, once ads can load or the player owns the Supporter Pack. */
  get offered() { return native && (supporter || adsOn); },
  get canReward() { return supporter || (ready && !busy); },
  reward, buy, restore,
  privacyOptions: () => AdMob ? AdMob.showPrivacyOptionsForm() : Promise.resolve(),
  onChange: f => subs.push(f),
  openRoundsman, roundsmanUrl: CONFIG.roundsmanUrl
};
if (native) window.addEventListener('DOMContentLoaded', () => { startShop(); startAds(); });
})();

</script>

/* ---------- the street scene ---------- */
const COLORS = { pickup: '#8F6F1F', rear: 'var(--body)', side: '#1F6F8C', front: '#7A3E8C', roll: '#A8401A' };
function truckSvg(k) {
  const c = COLORS[k];
  if (k === 'pickup') return `<rect x="0" y="10" width="28" height="12" rx="2" fill="${c}"/><rect x="28" y="4" width="14" height="18" rx="3" fill="var(--cab)"/><rect x="32" y="7" width="7" height="6" rx="1" fill="var(--sky)"/><rect x="-26" y="12" width="22" height="9" rx="1" fill="var(--house)"/><circle cx="8" cy="23" r="4" fill="#222"/><circle cx="34" cy="23" r="4" fill="#222"/><circle cx="-15" cy="23" r="3.5" fill="#222"/>`;
  const h = k === 'roll' ? 12 : 18;
  return `<rect x="0" y="${22 - h}" width="44" height="${h}" rx="3" fill="${c}"/><rect x="44" y="2" width="16" height="20" rx="3" fill="var(--cab)"/><rect x="48" y="5" width="9" height="7" rx="1" fill="var(--sky)"/>${k === 'front' ? '<rect x="58" y="0" width="3" height="10" fill="#555"/>' : ''}${k === 'side' ? '<rect x="18" y="0" width="4" height="8" fill="#555"/>' : ''}<circle cx="10" cy="23" r="4.5" fill="#222"/><circle cx="34" cy="23" r="4.5" fill="#222"/><circle cx="52" cy="23" r="4.5" fill="#222"/>`;
}
/* Each region has its own street. Everything sits above the road line (y 86). */
function backdrop(id) {
  let h = '';
  const house = (x, hh, door) => `<rect x="${x}" y="${70 - hh}" width="34" height="${hh}" fill="var(--house)" opacity=".85"/><path d="M${x - 3} ${70 - hh}l20-14 20 14z" fill="var(--house)"/><rect x="${x + 13}" y="58" width="8" height="12" fill="var(--sky)" opacity=".6"/>${door || ''}`;
  const can = (x, i) => `<rect x="${x}" y="76" width="7" height="10" rx="1" fill="${i % 3 === 0 ? 'var(--svc)' : 'var(--good)'}"/>`;
  if (id === 'lakes') {
    h += `<rect y="44" width="360" height="26" fill="#5E8FB8" opacity=".55"/><g class="sail"><path d="M0 52l10-14v14z" fill="#F5F1E3"/><path d="M-4 52h18l-3 4h-12z" fill="#7A4E2D"/></g>`;
    for (let i = 0; i < 7; i++) { const x = 6 + i * 52; h += i % 2 ? `<path d="M${x + 8} 70l12-30 12 30z" fill="#2F5D45"/><path d="M${x + 12} 56l8-22 8 22z" fill="#3E7356"/>` : house(x, 22 + (i * 5 % 8)); h += can(x + 38, i); }
  } else if (id === 'plains') {
    h += `<rect x="40" y="38" width="44" height="32" fill="#A8401A" opacity=".9"/><path d="M36 38l26-16 26 16z" fill="#7A2E12"/><rect x="56" y="52" width="12" height="18" fill="#F5F1E3" opacity=".8"/>
      <rect x="92" y="22" width="16" height="48" rx="8" fill="#B8B2A0"/><path d="M92 30h16" stroke="#8E8878"/>
      <rect x="230" y="30" width="3" height="40" fill="#6B6455"/><g class="blades" style="transform-origin:231.5px 30px"><path d="M231.5 30l0-16M231.5 30l14 8M231.5 30l-14 8" stroke="#6B6455" stroke-width="3" stroke-linecap="round"/></g>
      <path d="M140 66h80M140 60h80" stroke="#8F6F1F" stroke-width="1.5"/>`;
    for (let x = 140; x <= 220; x += 16) h += `<rect x="${x}" y="56" width="2" height="14" fill="#8F6F1F"/>`;
    h += house(270, 24) + can(310, 0) + can(130, 1) + can(30, 2);
  } else if (id === 'coast') {
    h += `<circle cx="300" cy="22" r="12" fill="#F2C14E" opacity=".9"/><rect y="46" width="360" height="24" fill="#3C8FB0" opacity=".6"/><path class="waves" d="M-40 52q10-4 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#F5F1E3" stroke-width="1.5" opacity=".7"/>`;
    const pastel = ['#E8A4A0', '#F2D49B', '#9FD3C7', '#B9C7E8'];
    for (let i = 0; i < 6; i++) { const x = 8 + i * 60; h += `<rect x="${x}" y="40" width="32" height="20" fill="${pastel[i % 4]}"/><path d="M${x - 3} 40l19-11 19 11z" fill="#C97B5A"/><rect x="${x + 3}" y="60" width="3" height="10" fill="#7A6A55"/><rect x="${x + 26}" y="60" width="3" height="10" fill="#7A6A55"/>
      <rect x="${x + 44}" y="40" width="3" height="30" fill="#8C6A3F"/><path d="M${x + 45} 40q-12 -2 -16 6M${x + 45} 40q12 -2 16 6M${x + 45} 40q-6 -10 -14 -10M${x + 45} 40q6 -10 14 -10" stroke="#3E7A4A" stroke-width="3" fill="none" stroke-linecap="round"/>` + can(x + 36, i); }
  } else if (id === 'desert') {
    h += `<circle cx="320" cy="20" r="11" fill="#F2A541" opacity=".9"/><path d="M120 70v-30h40l10-8h60l8 8h30v30z" fill="#B5653A" opacity=".55"/>`;
    for (let i = 0; i < 6; i++) { const x = 6 + i * 60; h += `<rect x="${x}" y="48" width="38" height="22" fill="#D9A06B"/><rect x="${x + 4}" y="44" width="30" height="5" fill="#C48A57"/><rect x="${x + 6}" y="54" width="7" height="7" fill="#7A4E2D" opacity=".7"/><rect x="${x + 22}" y="56" width="9" height="14" fill="#7A4E2D" opacity=".8"/>`;
      h += `<path d="M${x + 49} 70v-22M${x + 49} 58h-5v-6M${x + 49} 54h5v-5" stroke="#4F7A43" stroke-width="4" stroke-linecap="round" fill="none"/>` + can(x + 40, i); }
  } else if (id === 'metro') {
    const tall = [62, 40, 78, 52, 88, 46, 70, 58, 82, 44];
    tall.forEach((t, i) => { const x = i * 36; h += `<rect x="${x}" y="${70 - t}" width="32" height="${t}" fill="var(--house)" opacity="${.65 + (i % 3) * .1}"/>`;
      for (let wy = 74 - t; wy < 64; wy += 9) for (let wx = x + 5; wx < x + 28; wx += 8) h += `<rect class="win${(wx + wy) % 5 === 0 ? ' blink' : ''}" x="${wx}" y="${wy}" width="4" height="5" fill="#F2D49B" opacity="${(wx * 7 + wy) % 4 === 0 ? .9 : .3}"/>`;
      h += can(x + 26, i); });
  } else {
    for (let i = 0; i < 7; i++) { const x = 8 + i * 52; h += house(x, 26 + (i * 7 % 12)) + can(x + 38, i); }
  }
  return h;
}
function scene() {
  const gold = M.supporter, R = T.region(S), w = T.working(S), list = []; ['side', 'rear', 'front', 'roll', 'pickup'].forEach(k => { for (let i = 0; i < w[k] && list.length < 5; i++) list.push(k); });

function tip() {
  const e = T.economy(S), R = T.region(S);
  const lastR = (S.region || 0) === T.REGIONS.length - 1, outcome = lastR ? 'you lose this branch for good (until you rebrand)' : R.name + ' shuts you out for 30 minutes and half your customers leave';
  if (R.ban && S.rep < T.BAN.rep) return 'The county boards are fed up. Get your reputation above ' + T.BAN.rep + ' in the next ' + Math.max(1, Math.ceil(T.BAN.secs - (S.banClock || 0))) + 's or ' + outcome + '.';
  if (R.ban && S.rep < T.BAN.rep + 10) return 'People in ' + R.name + ' are losing patience. If your reputation drops below ' + T.BAN.rep + ' for too long, ' + outcome + '.';
  if (S.legacy.sales === 0 && T.truckCount(S) === 1 && S.cash < T.price.truck(S, 'pickup')) return 'Tap Ride along to earn your first dollars, and hand out flyers to sign up homes. Your pickup serves ' + Math.round(T.TRUCKS.pickup.cap * T.mults(S).cap) + ' homes.';
  if (T.truckCount(S) - 1 > S.drivers) return 'A truck is parked with nobody to drive it. Hire a driver on the Fleet tab.';
  if (e.totalMissed >= 1) return num(e.totalMissed) + (Math.floor(e.totalMissed) === 1 ? ' customer is' : ' customers are') + ' being missed. Add trucks on the Fleet tab, or pause sign-ups below, before your reputation drops.';
  if (T.truckCount(S) >= T.slots(S)) return 'Your yard is full. Open a new yard, or upgrade your yards, on the Fleet tab to park more trucks.';
  if (!S.unlocks.commercial && S.cash > 3000) return 'The Office tab has a commercial license: dumpsters pay far more per stop than homes.';
  return '';
}

    }) + `<h2>Regions</h2><p class="muted small" style="margin-top:-4px">Each region is its own branch with its own cash; money does not move between them. A new branch starts with a set amount. Switch back and forth any time: the branches you are not in keep running at ${Math.round(T.MANAGER.base * 100)}% speed, faster with a regional manager. Later regions pay more, but trust comes slower and goes faster.</p>` +
      `<div class="card"><div class="item"><div class="ic">${ic('people')}</div><div class="grow"><h3>Regional manager <span class="pill" ${B(() => 'level ' + (S.manager || 0))}></span></h3><div class="about" ${B(() => 'Keeps ' + esc(T.region(S).name) + ' running at ' + Math.round(T.awaySpeed(S) * 100) + '% while you are in another region' + ((S.manager || 0) < T.MANAGER.max ? ' (next level: ' + Math.round(T.awaySpeed({ manager: (S.manager || 0) + 1 }) * 100) + '%).' : '.'))}></div></div>${buyBtn('Hire', () => (S.manager || 0) < T.MANAGER.max ? T.price.manager(S) : null, 'hireManager')}</div></div>` +
      SEC(() => [S.region, Object.keys(S.banned || {}).join(), Object.keys(S.regions || {}).join(), Object.keys(S.locks || {}).map(id => id + Math.ceil(T.lockLeft(S, id) / 60)).join(), T.REGIONS.filter(r => S.earned >= r.need).length].join('|'), () => T.REGIONS.map((R, i) => {
        const here = i === S.region, banned = S.banned && S.banned[R.id], lock = T.lockLeft(S, R.id), br = S.regions && S.regions[i], open = S.earned >= R.need;
        const diff = ['Easy', 'Fair', 'Tough', 'Hard', 'Harsh', 'Brutal'][i], last = i === T.REGIONS.length - 1;
        const pill = here ? '<span class="pill good">you are here</span>' : banned ? '<span class="pill bad">ran you out</span>' : lock ? '<span class="pill bad">shut ' + Math.ceil(lock / 60) + 'm</span>' : br ? '<span class="pill">' + money(br.cash) + ' · ' + Math.round(T.awaySpeed(br) * 100) + '% speed</span>' : '';
        const btn = here ? '' : banned ? '<button class="btn" data-a="rename">Rebrand<small>to return</small></button>' : lock ? '<button class="btn" disabled>Shut<small>' + Math.ceil(lock / 60) + ' min</small></button>' : br ? `<button class="btn" data-a="move" data-x="${i}">Switch</button>` : open ? `<button class="btn" data-a="moveAsk" data-x="${i}">Open<small>start ${money(R.fund)}</small></button>` : `<button class="btn" disabled>Locked<small>earn ${money(R.need)}</small></button>`;
        const rule = !i ? 'Easy · never runs you out' : diff + ' · pays ' + R.rate + '× · towns ' + R.scale + '× bigger · ' + (last ? 'run out here and the branch is gone until you rebrand' : 'can shut you out for 30 minutes');
        return `<div class="card${here ? ' offer' : ''}"><div class="item"><div class="ic">${ic('map')}</div><div class="grow"><h3>${esc(R.name)} ${pill}</h3><div class="about">${esc(R.about)}</div><div class="meta small muted">${rule}</div></div>${btn}</div></div>`;
      }).join('')) + `<h2>Marketing</h2><div class="card"><div class="item"><div class="ic">${ic('pen')}</div><div class="grow"><h3>Door hangers and ads <span class="pill" ${B(() => 'level ' + S.marketing)}></span></h3><div class="about">+35% sign-up speed each level.</div></div>${buyBtn('Run', () => T.price.marketing(S), 'marketing')}</div></div>
      <h2>Your market</h2>` + SEC(() => Object.keys(S.unlocks).join(), () => ['res', 'com', 'ro'].map(svcRow).join('')) +
      `<div class="card"><h3>Money per second</h3>` + [['Collection', e => e.gross], ['Recycling sales', e => e.recycle, () => S.unlocks.recycling], ['Tipping fees from others', e => e.tipping, () => S.unlocks.landfill], ['Dump fees', e => -e.dump], ['Fuel', e => -e.fuel], ['Wages', e => -e.wages]].map(([l, f, on]) => `<div class="split" ${on ? B(() => ({ show: !!on() })) : ''}><span>${l}</span><b class="num" ${B(() => money(f(T.economy(S)), 2))}></b></div>`).join('') +
      `<div class="split"><span>Recycling price</span><b class="num" ${B(() => S.unlocks.recycling ? S.price.toFixed(2) + '×' : 'no program yet')}></b></div></div>`;
  },

  office() {
    return `<h2>Roundsman software</h2><p class="muted small" style="margin-top:-4px">The route book your crew already trusts. Each module is bought level by level.</p>` +
      Object.keys(T.SOFTWARE).map(k => { const M = T.SOFTWARE[k]; return `<div class="card"><div class="item"><div class="ic">${ic('office')}</div><div class="grow"><h3>${esc(M.name)} <span class="pill num" ${B(() => T.lvl(S.software, k) + ' / ' + M.max)}></span></h3><div class="about">${esc(M.about)}</div></div>${buyBtn('Upgrade', () => T.lvl(S.software, k) >= M.max ? null : T.price.software(S, k), 'software', k)}</div></div>`; }).join('') +
      `<h2>Big moves</h2>` + Object.keys(T.UNLOCKS).map(k => { const U = T.UNLOCKS[k]; return `<div class="card"><div class="item"><div class="ic">${ic(k === 'recycling' || k === 'mrf' || k === 'compost' ? 'recycle' : k === 'cng' ? 'bolt' : 'key')}</div><div class="grow"><h3>${esc(U.name)}</h3><div class="about">${esc(U.about)}</div></div>${buyBtn('Buy', () => S.unlocks[k] ? null : U.cost, 'unlock', k, () => U.needs && !S.unlocks[U.needs] ? 'Needs ' + T.UNLOCKS[U.needs].name.toLowerCase() : '')}</div></div>`; }).join('');
  },

  trophies() {
    return `<div class="card stat"><div class="v num" ${B(() => Object.keys(S.legacy.achievements).length + ' of ' + T.ACH.length)}></div><div class="l">trophies. Each one adds 2% to all revenue, for good.</div></div>` +
      SEC(() => Object.keys(S.legacy.achievements).length, () => '<div class="trophies">' + T.ACH.slice().sort((a, b) => (S.legacy.achievements[b.id] ? 1 : 0) - (S.legacy.achievements[a.id] ? 1 : 0)).map(a => { const got = S.legacy.achievements[a.id]; return `<div class="trophy${got ? ' got' : ''}"><div class="ic">${ic(a.icon)}</div><div><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p></div></div>`; }).join('') + '</div>');
  },

  company() {
    const L = S.legacy;
    return `<h2>${esc(S.name || 'Your company')}</h2>
      <div class="grid2"><div class="card stat"><div class="v num" ${B(() => money(S.earned))}></div><div class="l">earned this run</div></div>
      <div class="card stat"><div class="v num" ${B(() => L.stars + ' ★')}></div><div class="l" ${B(() => 'Legacy stars. Each adds 10% revenue (now +' + (L.stars * 10) + '%).')}></div></div></div>
      <div class="card"><h3>Sell the company</h3><p class="about">A buyer takes the trucks, towns and money. You keep your trophies and Legacy, and start again with one pickup, faster every time.</p>
        <div class="meta" ${B(() => { const st = T.starsFor(S); return { h: st ? `Buyers would give you <b>${st} Legacy star${st > 1 ? 's' : ''}</b>.` : `Buyers start calling once you have earned ${money(1e6)} in a run.` }; })}></div>
        <div style="margin-top:8px"><button class="btn" data-a="sellAsk" ${B(() => ({ dis: T.starsFor(S) < 1 }))}>Sell the company</button></div></div>
      <h2>Legacy perks</h2>` + Object.keys(T.LEGACY).map(k => { const D = T.LEGACY[k]; return `<div class="card"><div class="item"><div class="ic">${ic('star')}</div><div class="grow"><h3>${esc(D.name)} <span class="pill num" ${B(() => T.lvl(L.perks, k) + ' / ' + D.max)}></span></h3><div class="about">${esc(D.about)}</div></div>
        <button class="btn" data-a="legacy" data-x="${k}" ${B(() => { if (T.lvl(L.perks, k) >= D.max) return { h: 'Done', dis: true, cls: 'btn done' }; const c = T.price.legacy(S, k); return { h: 'Buy<small>' + c + ' ★</small>', dis: L.stars < c, cls: 'btn' }; })}></button></div></div>`; }).join('') +
      `<h2>Support the game</h2>` + SEC(() => [M.supporter, M.shopOn, M.price].join(), () => !(M.shopOn || M.supporter) ? '' : M.supporter
        ? `<div class="card"><div class="item"><div class="ic" style="color:var(--gold)">${ic('star')}</div><div class="grow"><h3>Supporter Pack <span class="pill good">owned</span></h3><div class="about">Thank you. Every reward is instant with no ads, your trucks wear gold, and you are helping fund Roundsman.</div></div></div></div>`
        : `<div class="card"><div class="item"><div class="ic" style="color:var(--gold)">${ic('star')}</div><div class="grow"><h3>Supporter Pack</h3><div class="about">One purchase, yours for good on your Google account: every reward with no ads, gold trucks on your street, and you help fund the Roundsman route software.</div></div>
          <button class="btn" data-a="buySupporter">Buy${M.price ? '<small>' + esc(M.price) + '</small>' : ''}</button></div>
          <div class="split" style="margin-top:8px"><span class="small muted">Bought it before, or on another phone?</span><button class="btn ghost" data-a="restoreSupporter">Restore</button></div></div>`) +
      `<div class="card"><div class="item"><div class="ic">${ic('route')}</div><div class="grow"><h3>Built on Roundsman</h3><div class="about">Roundsman is real route software for residential waste haulers. Run a hauling company? Take a look.</div></div><button class="btn ghost" data-a="roundsman">Visit</button></div></div>
      <h2>Settings</h2><div class="card"><div class="split"><span>Company name</span><button class="btn ghost" data-a="rename">Rename</button></div>
        <div class="split"><span>Theme</span><span class="seg">${['auto', 'light', 'dark'].map(t => `<button data-a="theme" data-x="${t}" ${B(() => ({ press: (S.theme || 'auto') === t }))}>${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</span></div>
        <div class="split"><span>Save code (move to another phone)</span><span><button class="btn ghost" data-a="exportSave">Copy</button> <button class="btn ghost" data-a="importSave">Load</button></span></div>
        <div class="split"><span>Away time</span><b ${B(() => 'up to ' + T.mults(S).awayH + ' hours')}></b></div>
        <div class="split"><span>Start over completely</span><button class="btn ghost" data-a="wipeAsk">Erase</button></div>
        <div class="split"><span>Privacy</span><button class="btn ghost" data-a="privacy">Read</button></div>
        ${SEC(() => M.privacyNeeded, () => M.privacyNeeded ? '<div class="split"><span>Ad privacy choices</span><button class="btn ghost" data-a="adPrivacy">Change</button></div>' : '')}</div>
      <p class="muted small">Idle Roundsman ${T.VERSION}, built on the Roundsman world. Saves on this device every few seconds.</p>`;
