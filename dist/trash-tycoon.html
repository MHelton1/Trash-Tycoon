<style>
:root{
  /* safe areas: Capacitor 8 on Android sets --safe-area-inset-*, browsers and iOS use env() */
  --sa-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sa-r:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --sa-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)); --sa-l:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  --bg:#ECE8DA; --panel:#FBF9F1; --ink:#14213A; --muted:#4A5870; --line:#D3CDB8;
  --road:#CCC6B0; --house:#66748A; --svc:#1F4E8C; --gold:#8F6F1F; --sign:#14284B;
  --good:#2F6B4F; --note:#B08D3C; --bad:#A8401A; --warn-bg:#F7E9C8; --warn-ink:#5A4300; --soft:#E9E4D3; --focus:#1F4E8C;
  --sky:#DCE4E8; --grass:#C9D3B0; --cab:#1F4E8C; --body:#2F6B4F; --on:#FFFFFF;
  --serif:'Libre Caslon Text','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'Libre Franklin','Franklin Gothic Medium','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424; --panel:#131C30; --ink:#ECE8DA; --muted:#9FAEC6; --line:#26324D;
    --road:#2A3856; --house:#8494AE; --svc:#7FA3DA; --gold:#D9B35A; --sign:#22406F;
    --good:#5FB88C; --note:#E8B93B; --bad:#FF8A5C; --warn-bg:#3A2F12; --warn-ink:#F2DDA0; --soft:#1A2540; --focus:#8FB0E6;
    --sky:#14203A; --grass:#1B2B26; --cab:#5B7FBF; --body:#3F8F6A; --on:#0C1424; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424; --panel:#131C30; --ink:#ECE8DA; --muted:#9FAEC6; --line:#26324D;
  --road:#2A3856; --house:#8494AE; --svc:#7FA3DA; --gold:#D9B35A; --sign:#22406F;
  --good:#5FB88C; --note:#E8B93B; --bad:#FF8A5C; --warn-bg:#3A2F12; --warn-ink:#F2DDA0; --soft:#1A2540; --focus:#8FB0E6;
  --sky:#14203A; --grass:#1B2B26; --cab:#5B7FBF; --body:#3F8F6A; --on:#0C1424; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.cash,.v{font-variant-numeric:tabular-nums lining-nums}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--sign);color:#F5F1E3;padding-block:calc(var(--sa-t) + 10px) 10px;padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r))}
.top .row{display:flex;align-items:baseline;gap:10px}
.top .co{font:700 17px/1.1 var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .day{font-size:13px;opacity:.8}
.top .cash{font:700 30px/1.1 var(--sans);letter-spacing:-.5px;margin-top:4px}
.top .sub{display:flex;gap:14px;font-size:13px;opacity:.9;margin-top:2px;flex-wrap:wrap}
.top .sub b{font-weight:600}
.top .neg{color:#FFB79A}

main{flex:1;padding-block:12px calc(84px + var(--sa-b));padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sa-b)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative;min-height:56px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--svc)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.tabs .dot.on{display:block}

h2{font:700 19px/1.2 var(--serif);margin:18px 0 8px}
h2:first-child{margin-top:4px}
h3{font:600 15px/1.25 var(--sans);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.card.offer{border:2px solid var(--note)}
.item{display:flex;gap:12px;align-items:center}
.item .grow{flex:1;min-width:0}
.item .about{color:var(--muted);font-size:13px;margin-top:2px}
.item .meta{font-size:13px;margin-top:3px}
.ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--svc)}
.ic svg{width:22px;height:22px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 12px;min-height:44px;min-width:88px;font-weight:600;font-size:14px;line-height:1.15;text-align:center}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{background:var(--soft);color:var(--muted);border-color:var(--line);cursor:default}
.btn.done{background:transparent;color:var(--good);border-color:transparent}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--svc);border-radius:5px;transition:width .3s}
.bar.bad i{background:var(--bad)}
.bar.good i{background:var(--good)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600}
.pill.bad{background:var(--bad);color:#fff}
.pill.good{background:var(--good);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font:700 20px/1.1 var(--sans)}
.stat .l{font-size:12.5px;color:var(--muted)}
.split{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
.split+.split{border-top:1px dashed var(--line)}

/* the street */
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sky);height:132px;margin-bottom:10px}
.scene svg{display:block;width:100%;height:100%}
.scene .truck{animation:drive var(--dur,14s) linear infinite}
.scene .truck.hop{animation-play-state:running}
@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(460px)}}
@media (prefers-reduced-motion:reduce){.scene .truck{animation:none;transform:translateX(150px)}}
.scene .lbl{position:absolute;left:10px;top:8px;font-size:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 8px;border-radius:12px}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:10px}
.tap{position:relative;border:0;border-radius:14px;background:var(--good);color:var(--on);padding:14px 10px;min-height:76px;font-weight:700;font-size:17px;box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000);user-select:none;-webkit-user-select:none}
.tap:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--good) 60%,#000)}
.tap small{display:block;font-weight:500;font-size:13px;opacity:.9}
.tap.alt{background:var(--svc);box-shadow:0 3px 0 color-mix(in srgb,var(--svc) 60%,#000)}
.float{position:fixed;pointer-events:none;font-weight:700;color:var(--good);animation:up .9s ease-out forwards;z-index:20;text-shadow:0 1px 0 var(--panel)}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

.log{font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.log li:first-child{border-top:0}
.log .d{color:var(--muted);min-width:58px;white-space:nowrap}
.log .bad{color:var(--bad)}
.log .good{color:var(--good)}

.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.trophy{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start}
.trophy .ic{width:32px;height:32px;border-radius:8px}
.trophy .ic svg{width:18px;height:18px}
.trophy h3{font-size:13.5px}
.trophy p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.trophy.got .ic{background:var(--note);color:#fff}
.trophy:not(.got){opacity:.6}
.trophy:not(.got) .ic{color:var(--muted)}

.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--sa-b) + 66px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--panel);color:var(--ink);border:2px solid var(--note);border-radius:12px;padding:6px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;max-width:420px;width:100%;animation:drop .3s ease-out}
.toast .ic{background:var(--note);color:#fff;width:30px;height:30px}
.toast .ic svg{width:18px;height:18px}
.toast .small{display:none}
.toast b{display:block;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
@keyframes drop{from{transform:translateY(20px);opacity:0}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,15,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.switch{border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:4px 10px;font-size:12.5px;min-height:32px}
.switch[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--note)}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script>
/* Trash Tycoon engine: the whole simulation, with no screen code, so it runs the same in the app, in tests and in the pacing bot.
   Time is in seconds. Money is in dollars. Everything that grows uses a price multiplier per item already owned. */
(function (root) {
'use strict';

const SERVICES = {
  res: { name: 'Residential', unit: 'homes', each: 'home', rate: 0.25, dump: 0.02, market: 'homes' },
  com: { name: 'Commercial', unit: 'businesses', each: 'business', rate: 3, dump: 0.25, market: 'biz', unlock: 'commercial' },
  ro:  { name: 'Roll-off', unit: 'job sites', each: 'job site', rate: 25, dump: 2.5, market: 'sites', unlock: 'rolloff' }
};

const TRUCKS = {
  pickup: { name: 'Pickup with trailer', svc: 'res', cap: 40, cost: 60, mult: 1.3, fuel: 0.05, about: 'Where everyone starts. Cans in the bed, bags on the trailer.' },
  rear:   { name: 'Rear loader', svc: 'res', cap: 400, cost: 900, mult: 1.13, fuel: 0.4, about: 'Two on the back, one driving. The workhorse of residential.' },
  side:   { name: 'Automated side loader', svc: 'res', cap: 1100, cost: 60000, mult: 1.1, fuel: 0.7, unlock: 'arms', about: 'One driver, an arm and a joystick. Carts must be at the curb.' },
  front:  { name: 'Front loader', svc: 'com', cap: 60, cost: 4000, mult: 1.13, fuel: 0.6, unlock: 'commercial', about: 'Forks over the cab for restaurant and store dumpsters.' },
  roll:   { name: 'Roll-off truck', svc: 'ro', cap: 8, cost: 15000, mult: 1.13, fuel: 0.7, unlock: 'rolloff', about: 'Drops and pulls 30-yard boxes at construction sites.' }
};
const TRUCK_ORDER = ['pickup', 'rear', 'side', 'front', 'roll'];

const TOWNS = [
  { id: 'maple', name: 'Maple Hollow', homes: 400, biz: 20, sites: 2, cost: 0 },
  { id: 'cedar', name: 'Cedar Falls', homes: 1500, biz: 80, sites: 8, cost: 5000 },
  { id: 'river', name: 'Riverton', homes: 5000, biz: 300, sites: 30, cost: 150000 },
  { id: 'granite', name: 'Granite City', homes: 18000, biz: 1100, sites: 110, cost: 2.2e6 },
  { id: 'ashby', name: 'Port Ashby', homes: 60000, biz: 3800, sites: 380, cost: 3.5e7 },
  { id: 'metro', name: 'Metro Bay', homes: 220000, biz: 14000, sites: 1400, cost: 6e8 }
];
const REGION_NAMES = ['Tri-County', 'Lakeshore', 'High Plains', 'Iron Range', 'Gulf Coast', 'Northwoods', 'Desert Valley', 'Twin Rivers', 'Bluegrass', 'Red Rock', 'Pine Barrens', 'Silver Coast'];
/* After the named towns the map keeps going: each region is bigger and dearer than the last. */
function townDef(i) {
  if (i < TOWNS.length) return TOWNS[i];
  const k = i - TOWNS.length + 1, base = TOWNS[TOWNS.length - 1];
  const nm = REGION_NAMES[(k - 1) % REGION_NAMES.length] + (k > REGION_NAMES.length ? ' ' + (Math.floor((k - 1) / REGION_NAMES.length) + 1) : '');
  return { id: 'r' + k, name: nm + ' Region', homes: Math.round(base.homes * Math.pow(3, k)), biz: Math.round(base.biz * Math.pow(3, k)), sites: Math.round(base.sites * Math.pow(3, k)), cost: base.cost * Math.pow(14, k) };
}

/* Software modules: the Roundsman suite, bought level by level. */
const SOFTWARE = {
  planner:  { name: 'Route planner', about: 'Tighter routes. +12% stops per truck.', cost: 600, mult: 2.4, max: 15 },
  pricing:  { name: 'Price alignment', about: 'Move old accounts to standard prices. +10% revenue.', cost: 1500, mult: 2.6, max: 20 },
  portal:   { name: 'Customer portal', about: 'Sign-ups online. +25% customer growth.', cost: 900, mult: 2.3, max: 12 },
  reports:  { name: 'Truck reports', about: 'Pre-trip inspections. -15% breakdowns.', cost: 3000, mult: 2.5, max: 8 },
  dispatch: { name: 'Roadcall dispatch', about: 'Mechanics find the truck faster. -15% repair time.', cost: 4000, mult: 2.5, max: 8 },
  payroll:  { name: 'Hours and payroll', about: 'Clean timesheets. -8% wages.', cost: 5000, mult: 2.6, max: 8 },
  offline:  { name: 'Offline route book', about: 'Routes keep running when you are away. +1 hour away time.', cost: 8000, mult: 3, max: 8 }
};

/* One-time unlocks that open new ways to grow. */
const UNLOCKS = {
  commercial: { name: 'Commercial license', about: 'Haul dumpsters for stores and restaurants. Opens front loaders.', cost: 3000 },
  rolloff:    { name: 'Roll-off permit', about: 'Construction boxes pay big per job. Opens roll-off trucks.', cost: 25000, needs: 'commercial' },
  arms:       { name: 'Automated arms', about: 'Side loaders: one driver, triple the stops.', cost: 40000 },
  recycling:  { name: 'Recycling program', about: 'Every home served also sells sorted material. Prices move daily.', cost: 25000 },
  mrf:        { name: 'Sorting plant', about: 'Your own sorting line. Recycling pays 2.5x.', cost: 900000, needs: 'recycling' },
  transfer:   { name: 'Transfer station', about: 'Consolidate loads. Dump fees cut in half.', cost: 120000 },
  landfill:   { name: 'Your own landfill', about: 'No dump fees, and other haulers pay you to tip.', cost: 1.2e7, needs: 'transfer' },
  cng:        { name: 'Natural gas fleet', about: 'CNG fueling at the yard. Fuel costs -45%.', cost: 350000 },
  compost:    { name: 'Yard waste and compost', about: 'Green carts on every route. +15% residential revenue.', cost: 2.5e6, needs: 'recycling' }
};

/* Legacy perks: bought with stars earned by selling the company. They survive every sale. */
const LEGACY = {
  pay:     { name: 'Good name', about: '+25% revenue, every run.', cost: 1, mult: 2, max: 20 },
  grow:    { name: 'Old friends', about: '+30% customer growth.', cost: 1, mult: 2, max: 10 },
  start:   { name: 'Head start', about: 'Start each run with $5,000 per level.', cost: 2, mult: 2, max: 10 },
  away:    { name: 'Long memory', about: '+2 hours of away time.', cost: 2, mult: 2.5, max: 6 },
  tap:     { name: 'Still rides along', about: 'Riding along pays 3x.', cost: 1, mult: 3, max: 6 }
};

const BASE = {
  wage: 0.5,                // per driver per second
  mechWage: 0.9,            // per mechanic per second
  driverCost: 40, driverMult: 1.1,
  mechCost: 2500, mechMult: 1.35,
  yardCost: 2000, yardMult: 2, yardSlots: 10, drivewaySlots: 4,
  mktCost: 300, mktMult: 1.9,
  growth: 0.006,            // share of the open market signed per second at reputation 50
  breakdown: 1 / 900,       // per working truck per second
  repair: 150,              // seconds a truck is down with no mechanic
  awayHours: 4
};

const TAU = { day: 30 }; // one in-game day is 30 seconds

function fresh(legacy) {
  legacy = legacy || { stars: 0, earnedStars: 0, perks: {}, sales: 0, best: 0, achievements: {} };
  const s = {
    v: 1, cash: 0, earned: 0, t: 0, day: 1, rep: 60,
    towns: 1, cust: { res: 0, com: 0, ro: 0 }, paused: { res: false, com: false, ro: false },
    trucks: { pickup: 1, rear: 0, side: 0, front: 0, roll: 0 },
    drivers: 0, mechanics: 0, yards: 0, marketing: 0,
    software: {}, unlocks: {},
    down: [],                 // [{ type, left, total, where }]
    price: 1, priceDir: 0,    // recycling price index
    offer: null, nextOffer: 120,
    log: [],
    stats: { taps: 0, flyers: 0, roadcalls: 0, rushed: 0, contracts: 0, bestNet: 0, perfectDays: 0, missedDays: 0, away: 0, maxPrice: 1 },
    legacy, seed: (Math.random() * 2 ** 31) | 0,
    lastSeen: Date.now()
  };
  s.cash = 5000 * lvl(legacy.perks, 'start');
  return s;
}

const lvl = (o, k) => (o && o[k]) || 0;
const costAt = (base, mult, n) => Math.ceil(base * Math.pow(mult, n));

function rand(s) { // small seeded generator so the pacing bot and tests repeat
  s.seed = (s.seed * 1103515245 + 12345) & 0x7fffffff; return s.seed / 0x7fffffff;
}

/* ---------- derived numbers ---------- */
function market(s) {
  const m = { res: 0, com: 0, ro: 0 };
  for (let i = 0; i < s.towns; i++) { const t = townDef(i); m.res += t.homes; m.com += t.biz; m.ro += t.sites; }
  return m;
}
function slots(s) { return BASE.drivewaySlots + s.yards * BASE.yardSlots; }
function truckCount(s) { return TRUCK_ORDER.reduce((n, k) => n + s.trucks[k], 0); }
function needDrivers(s) { return Math.max(0, truckCount(s) - 1); } // you drive one truck yourself
function achCount(s) { return Object.keys(s.legacy.achievements).length; }

function mults(s) {
  const sw = s.software, L = s.legacy.perks;
  return {
    cap: 1 + 0.12 * lvl(sw, 'planner'),
    rev: (1 + 0.10 * lvl(sw, 'pricing')) * (1 + 0.02 * achCount(s)) * (1 + 0.25 * lvl(L, 'pay')) * (1 + 0.1 * s.legacy.stars),
    growth: (1 + 0.25 * lvl(sw, 'portal')) * (1 + 0.3 * lvl(L, 'grow')) * (1 + 0.35 * s.marketing),
    brk: Math.pow(0.85, lvl(sw, 'reports')) / (1 + 0.25 * s.mechanics),
    repair: Math.pow(0.85, lvl(sw, 'dispatch')),
    wage: Math.pow(0.92, lvl(sw, 'payroll')),
    fuel: s.unlocks.cng ? 0.55 : 1,
    dump: s.unlocks.landfill ? 0 : s.unlocks.transfer ? 0.5 : 1,
    awayH: BASE.awayHours + lvl(sw, 'offline') + 2 * lvl(L, 'away')
  };
}

/* Which trucks are on the road: not broken down, inside a yard slot, and with someone to drive them.
   Bigger trucks get drivers and slots first. */
function working(s) {
  const downBy = {}; s.down.forEach(d => { downBy[d.type] = (downBy[d.type] || 0) + 1; });
  let seats = s.drivers + 1, room = slots(s);
  const out = {}, order = ['side', 'roll', 'front', 'rear', 'pickup'];
  order.forEach(k => {
    const avail = Math.max(0, s.trucks[k] - (downBy[k] || 0));
    const n = Math.min(avail, seats, room); out[k] = n; seats -= n; room -= n;
  });
  return out;
}

function capacity(s, w) {
  w = w || working(s); const m = mults(s), c = { res: 0, com: 0, ro: 0 };
  TRUCK_ORDER.forEach(k => { c[TRUCKS[k].svc] += w[k] * TRUCKS[k].cap * m.cap; });
  return c;
}

/* Money per second, split into its parts, for the current state. */
function economy(s) {
  const w = working(s), cap = capacity(s, w), m = mults(s);
  const served = {}, missed = {}; let gross = 0, dump = 0;
  Object.keys(SERVICES).forEach(k => {
    served[k] = Math.min(s.cust[k], cap[k]); missed[k] = Math.max(0, s.cust[k] - cap[k]);
    let r = served[k] * SERVICES[k].rate * m.rev;
    if (k === 'res' && s.unlocks.compost) r *= 1.15;
    gross += r; dump += served[k] * SERVICES[k].dump;
  });
  let recycle = 0;
  if (s.unlocks.recycling) recycle = served.res * 0.035 * s.price * (s.unlocks.mrf ? 2.5 : 1) * m.rev;
  let tipping = 0;
  if (s.unlocks.landfill) tipping = (served.res * SERVICES.res.dump + served.com * SERVICES.com.dump + served.ro * SERVICES.ro.dump) * 1.5 + 40 * s.towns;
  dump *= m.dump;
  const fuel = TRUCK_ORDER.reduce((n, k) => n + w[k] * TRUCKS[k].fuel, 0) * m.fuel;
  const wages = (s.drivers * BASE.wage + s.mechanics * BASE.mechWage) * m.wage;
  const income = gross + recycle + tipping, costs = dump + fuel + wages;
  const totalCust = s.cust.res + s.cust.com + s.cust.ro, totalMissed = missed.res + missed.com + missed.ro;
  return { w, cap, served, missed, gross, recycle, tipping, dump, fuel, wages, income, costs, net: income - costs, totalCust, totalMissed };
}

function tapValue(s) {
  const e = economy(s);
  return (1 + Math.max(0, e.net) * 0.1) * (1 + 2 * lvl(s.legacy.perks, 'tap'));
}

/* ---------- prices of things ---------- */
const price = {
  truck: (s, k) => costAt(TRUCKS[k].cost, TRUCKS[k].mult, k === 'pickup' ? s.trucks.pickup - 1 : s.trucks[k]),
  driver: s => costAt(BASE.driverCost, BASE.driverMult, s.drivers),
  mechanic: s => costAt(BASE.mechCost, BASE.mechMult, s.mechanics),
  yard: s => costAt(BASE.yardCost, BASE.yardMult, s.yards),
  marketing: s => costAt(BASE.mktCost, BASE.mktMult, s.marketing),
  software: (s, k) => costAt(SOFTWARE[k].cost, SOFTWARE[k].mult, lvl(s.software, k)),
  unlock: (s, k) => UNLOCKS[k].cost,
  town: s => townDef(s.towns).cost,
  legacy: (s, k) => costAt(LEGACY[k].cost, LEGACY[k].mult, lvl(s.legacy.perks, k)),
  rush: (s, d) => Math.ceil(50 + d.left * (TRUCKS[d.type].cost / 400))
};

/* ---------- actions (each returns '' on success or the reason it can't) ---------- */
function spend(s, n) { if (s.cash < n) return 'Not enough cash yet.'; s.cash -= n; return ''; }
function note(s, txt, kind) { s.log.unshift({ t: s.t, day: Math.floor(s.day), txt, kind: kind || '' }); if (s.log.length > 40) s.log.length = 40; }

const act = {
  tap(s) { const v = tapValue(s); s.cash += v; s.earned += v; s.stats.taps++; return v; },
  flyer(s) {
    const mk = market(s); s.stats.flyers++;
    if (s.cust.res < mk.res && rand(s) < 0.35) { s.cust.res++; return 1; } return 0;
  },
  buyTruck(s, k) {
    const T = TRUCKS[k]; if (!T) return 'No such truck.';
    if (T.unlock && !s.unlocks[T.unlock]) return 'Needs ' + UNLOCKS[T.unlock].name + '.';
    if (truckCount(s) >= slots(s)) return 'No room in the yard. Buy a yard first.';
    const e = spend(s, price.truck(s, k)); if (e) return e;
    s.trucks[k]++; note(s, 'Bought a ' + T.name.toLowerCase() + '.'); return '';
  },
  hireDriver(s) { const e = spend(s, price.driver(s)); if (e) return e; s.drivers++; return ''; },
  hireMechanic(s) { const e = spend(s, price.mechanic(s)); if (e) return e; s.mechanics++; note(s, 'Hired mechanic number ' + s.mechanics + '.'); return ''; },

/* Time away: run the routes in one-minute steps, capped by the away-time limit. Returns what happened. */
function catchUp(s, now) {

/* A buy button: label, price function, action and its argument, and an optional "can't" reason. */
function buyBtn(label, cost, a, x, why) {
  return `<button class="btn" data-a="${a}"${x !== undefined ? ` data-x="${x}"` : ''} ${B(() => {
    const c = cost(), w = why ? why() : '';
    if (c === null) return { h: 'Done', dis: true, cls: 'btn done' };
    return { h: esc(w || label) + (w ? '' : `<small>${money(c)}</small>`), dis: !!w || S.cash < c, cls: 'btn' };
  })}></button>`;
}

/* ---------- header and tabs ---------- */
function header() {
  $('#top').innerHTML = `<div class="row"><div class="co" ${B(() => S.name || 'Your hauling company')}></div><div class="day" ${B(() => 'Day ' + Math.floor(S.day))}></div></div>
    <div class="cash" ${B(() => money(S.cash))}></div>
    <div class="sub"><span ${B(() => { const e = T.economy(S); return { h: `<b class="${e.net < 0 ? 'neg' : ''}">${money(e.net, 1)}</b>/s`, }; })}></span>
    <span ${B(() => ({ h: `<b>${num(T.economy(S).totalCust)}</b> customer${Math.floor(T.economy(S).totalCust) === 1 ? '' : 's'}` }))}></span>
    <span ${B(() => ({ h: `Reputation <b>${Math.round(S.rep)}</b>` }))}></span></div>`;
}
const TABS = [['route', 'Route'], ['fleet', 'Fleet'], ['grow', 'Grow'], ['office', 'Office'], ['trophies', 'Trophies'], ['company', 'Company']];
function tabsBar() {

}
function show(k) {

}

/* ---------- the street scene ---------- */
const COLORS = { pickup: '#8F6F1F', rear: 'var(--body)', side: '#1F6F8C', front: '#7A3E8C', roll: '#A8401A' };
function truckSvg(k) {
  const c = COLORS[k];
  if (k === 'pickup') return `<rect x="0" y="10" width="28" height="12" rx="2" fill="${c}"/><rect x="28" y="4" width="14" height="18" rx="3" fill="var(--cab)"/><rect x="32" y="7" width="7" height="6" rx="1" fill="var(--sky)"/><rect x="-26" y="12" width="22" height="9" rx="1" fill="var(--house)"/><circle cx="8" cy="23" r="4" fill="#222"/><circle cx="34" cy="23" r="4" fill="#222"/><circle cx="-15" cy="23" r="3.5" fill="#222"/>`;
  const h = k === 'roll' ? 12 : 18;
  return `<rect x="0" y="${22 - h}" width="44" height="${h}" rx="3" fill="${c}"/><rect x="44" y="2" width="16" height="20" rx="3" fill="var(--cab)"/><rect x="48" y="5" width="9" height="7" rx="1" fill="var(--sky)"/>${k === 'front' ? '<rect x="58" y="0" width="3" height="10" fill="#555"/>' : ''}${k === 'side' ? '<rect x="18" y="0" width="4" height="8" fill="#555"/>' : ''}<circle cx="10" cy="23" r="4.5" fill="#222"/><circle cx="34" cy="23" r="4.5" fill="#222"/><circle cx="52" cy="23" r="4.5" fill="#222"/>`;
}
function scene() {
  const w = T.working(S), list = []; ['side', 'rear', 'front', 'roll', 'pickup'].forEach(k => { for (let i = 0; i < w[k] && list.length < 5; i++) list.push(k); });
  let houses = ''; for (let i = 0; i < 7; i++) { const x = 8 + i * 52, h = 26 + (i * 7 % 12); houses += `<rect x="${x}" y="${70 - h}" width="34" height="${h}" fill="var(--house)" opacity=".85"/><path d="M${x - 3} ${70 - h}l20-14 20 14z" fill="var(--house)"/><rect x="${x + 13}" y="${58}" width="8" height="12" fill="var(--sky)" opacity=".6"/><rect x="${x + 38}" y="76" width="7" height="10" rx="1" fill="${i % 3 === 0 ? 'var(--svc)' : 'var(--good)'}"/>`; }
  const dur = Math.max(7, 16 - list.length * 1.5);
  const trucks = list.map((k, i) => `<g class="truck" style="--dur:${dur}s;animation-delay:-${(i * dur / Math.max(1, list.length)).toFixed(2)}s"><g transform="translate(0 ${i % 2 ? 98 : 84})">${truckSvg(k)}</g></g>`).join('');
  return `<div class="scene" aria-hidden="true"><svg viewBox="0 0 360 132" preserveAspectRatio="xMidYMid slice"><rect y="70" width="360" height="16" fill="var(--grass)"/>${houses}<rect y="86" width="360" height="46" fill="var(--road)"/><path d="M0 110h360" stroke="var(--panel)" stroke-width="2" stroke-dasharray="14 12" opacity=".7"/>${trucks}</svg><span class="lbl">${esc(T.townDef(S.towns - 1).name)}${S.towns > 1 ? ' and ' + (S.towns - 1) + ' more' : ''}</span></div>`;
}

/* ---------- tips for a new player ---------- */
function tip() {
  const e = T.economy(S);
  if (S.legacy.sales === 0 && T.truckCount(S) === 1 && S.cash < T.price.truck(S, 'pickup')) return 'Tap Ride along to earn your first dollars, and hand out flyers to sign up homes. Your pickup serves ' + Math.round(T.TRUCKS.pickup.cap * T.mults(S).cap) + ' homes.';
  if (T.truckCount(S) - 1 > S.drivers) return 'A truck is parked with nobody to drive it. Hire a driver on the Fleet tab.';
  if (e.totalMissed >= 1) return num(e.totalMissed) + (Math.floor(e.totalMissed) === 1 ? ' customer is' : ' customers are') + ' being missed. Add trucks on the Fleet tab, or pause sign-ups below, before your reputation drops.';
  if (T.truckCount(S) >= T.slots(S)) return 'Your yard is full. Open a new yard on the Fleet tab to park more trucks.';
  if (!S.unlocks.commercial && S.cash > 3000) return 'The Office tab has a commercial license: dumpsters pay far more per stop than homes.';
  return '';
}

/* ---------- modals and toasts ---------- */
function modal(html, onClick) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (ev.target === m) m.remove(); if (!b) return; if (onClick(b.dataset.m, m) !== false) m.remove(); });
  document.body.appendChild(m); const f = m.querySelector('input,textarea,button'); if (f) f.focus(); return m;
}
function toast(a) {
  const w = $('#toasts'), t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<div class="ic">${ic(a.icon)}</div><div><b>Trophy</b>${esc(a.name)}<div class="small muted">${esc(a.desc)}</div></div>`;
  w.appendChild(t); setTimeout(() => t.remove(), 3800); while (w.children.length > 2) w.firstChild.remove();
}
function note(txt) {
  const w = $('#toasts'), t = document.createElement('div'); t.className = 'toast'; t.style.borderColor = 'var(--line)'; t.innerHTML = `<div>${esc(txt)}</div>`;
  w.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function floatText(x, y, txt) { const f = document.createElement('div'); f.className = 'float'; f.style.left = (x - 20) + 'px'; f.style.top = (y - 20) + 'px'; f.textContent = txt; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
function welcome(r) {
  if (!r || r.seconds < 120) return;
  const h = Math.floor(r.seconds / 3600), m = Math.round(r.seconds % 3600 / 60);
  modal(`<h2>Welcome back</h2><p>Your crews ran routes for ${h ? h + ' h ' : ''}${m} min while you were away.</p><div class="split"><span>Cash made</span><b>${money(r.cash)}</b></div><div class="split"><span>New customers</span><b>${num(r.cust)}</b></div>${r.capped ? `<p class="small muted">Routes stop after ${T.mults(S).awayH} hours away. The Offline route book in the Office adds more.</p>` : ''}<div class="btns"><button class="btn" data-m="ok">Back to work</button></div>`, () => {});
}

/* ---------- actions ---------- */
function setTheme(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
const special = {
  tap(b, ev) { const v = T.act.tap(S); const r = b.getBoundingClientRect(); floatText(ev.clientX || r.left + r.width / 2, ev.clientY || r.top, '+' + money(v, 2)); if (navigator.vibrate) try { navigator.vibrate(4); } catch (e) { /* no haptics */ } },
  flyer(b, ev) { const r = b.getBoundingClientRect(), got = T.act.flyer(S); floatText(ev.clientX || r.left + r.width / 2, ev.clientY || r.top, got ? '+1 home' : 'no answer'); },
  rushId(b) { const i = S.down.findIndex(d => d.id === b.dataset.x); return T.act.rush(S, i); },
  sellAsk() { const st = T.starsFor(S); modal(`<h2>Sell ${esc(S.name || 'the company')}?</h2><p>You get <b>${st} Legacy star${st > 1 ? 's' : ''}</b> and start over with one pickup in Maple Hollow. Trophies and Legacy perks stay.</p><div class="btns"><button class="btn ghost" data-m="no">Keep running it</button><button class="btn" data-m="yes">Sell</button></div>`, k => { if (k === 'yes') { const name = S.name, theme = S.theme; S = T.act.sell(S); S.name = name; S.theme = theme; persist(); show('route'); } }); },
  legacy(b) { return T.act.legacy(S, b.dataset.x); },
  rename() { askName(); },
  theme(b) { S.theme = b.dataset.x; setTheme(S.theme); persist(); },
  exportSave() { const c = T.exportCode(S); modal(`<h2>Save code</h2><p class="small muted">Copy this and load it on another phone.</p><textarea readonly>${esc(c)}</textarea><div class="btns"><button class="btn" data-m="copy">Copy</button><button class="btn ghost" data-m="ok">Close</button></div>`, (k, m) => { if (k === 'copy') { const ta = m.querySelector('textarea'); ta.select(); try { navigator.clipboard.writeText(c); } catch (e) { document.execCommand('copy'); } note('Copied.'); } }); },
  importSave() { modal(`<h2>Load a save code</h2><p class="small muted">This replaces the game on this phone.</p><textarea></textarea><div class="btns"><button class="btn ghost" data-m="no">Cancel</button><button class="btn" data-m="load">Load</button></div>`, (k, m) => { if (k !== 'load') return; try { S = T.importCode(m.querySelector('textarea').value); setTheme(S.theme || 'auto'); persist(); show('route'); note('Save loaded.'); } catch (e) { note('That code did not work.'); return false; } }); },
  privacy() { modal(`<h2>Privacy</h2><p>Trash Tycoon does not collect, store or share any personal information. There are no accounts, ads, analytics or trackers, and the game does not go online.</p><p>Your company is saved only on this device. A save code is created only when you press Copy, and goes only where you paste it. Uninstalling the game or pressing Erase deletes everything.</p><p class="small muted">Full policy: <a href="${T.PRIVACY_URL}" target="_blank" rel="noopener">${esc(T.PRIVACY_URL.replace('https://', ''))}</a></p><div class="btns"><button class="btn" data-m="ok">Close</button></div>`, () => {}); },
  wipeAsk() { modal(`<h2>Erase everything?</h2><p>This deletes the company, your trophies and Legacy on this phone. It cannot be undone.</p><div class="btns"><button class="btn ghost" data-m="no">Cancel</button><button class="btn" style="background:var(--bad);border-color:var(--bad)" data-m="yes">Erase</button></div>`, k => { if (k === 'yes') { S = T.fresh(); persist(); show('route'); askName(); } }); }
};
function onClick(ev) {
  const t = ev.target.closest('[data-tab]'); if (t) { show(t.dataset.tab); return; }
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, x = b.dataset.x;
  let err = '';
  if (special[a]) err = special[a](b, ev) || ''; else if (T.act[a]) err = T.act[a](S, x) || '';
  if (typeof err === 'string' && err) note(err);
  if (a !== 'tap' && a !== 'flyer') persist();
  // the tab shape can change after a purchase (a new truck type, a new town)
  if (['unlock', 'expand', 'buyYard'].indexOf(a) >= 0 && tab !== 'route') show(tab); else refresh();
}
function askName() {
  modal(`<h2>${S.name ? 'Rename your company' : 'Start your trash company'}</h2>${S.name ? '' : '<p>You have one pickup, a trailer and 400 homes in Maple Hollow who need their cans emptied. Grow it into whatever you like.</p>'}<label class="small muted" for="nm">Company name</label><input type="text" id="nm" maxlength="32" value="${esc(S.name || 'Curbside Hauling')}"><div class="btns"><button class="btn" data-m="ok">${S.name ? 'Save' : 'Start hauling'}</button></div>`, (k, m) => { const v = m.querySelector('#nm').value.trim(); S.name = v || 'Curbside Hauling'; persist(); header(); refresh(); });
}

/* ---------- save and clock ---------- */
function persist() { try { localStorage.setItem(KEY, T.save(S)); } catch (e) { /* storage blocked: the game still runs */ } }
function frame() {
  const now = Date.now(), gap = (now - lastFrame) / 1000; lastFrame = now;
  if (gap > 30) { S.lastSeen = now - gap * 1000; welcome(T.catchUp(S, now)); }
  else if (gap > 0) T.tick(S, gap);
  const got = T.checkAch(S); got.forEach(toast); newTrophies += got.length;
  const dot = $('#dot-trophies'); if (dot) dot.classList.toggle('on', newTrophies > 0 && tab !== 'trophies');
  const fd = $('#dot-route'); if (fd) fd.classList.toggle('on', tab !== 'route' && (!!S.offer || S.down.length > 0));
  refresh();
}

function start() {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
  try { S = raw ? T.load(raw) : T.fresh(); } catch (e) { S = T.fresh(); }
  setTheme(S.theme || 'auto');
  let r = null; if (raw) r = T.catchUp(S);
  try { const t = localStorage.getItem(KEY + '-tab'); if (t && VIEWS[t]) tab = t; } catch (e) { /* private mode */ }
  tabsBar(); show(tab);
  document.addEventListener('click', onClick);
  setInterval(frame, 250); setInterval(persist, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);
  if (!S.name) askName(); else welcome(r);
}
window.addEventListener('DOMContentLoaded', start);
})();

</script>
</body>
</html>
